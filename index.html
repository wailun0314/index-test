<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>不對稱訓練系統 — 12 週計畫</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Particle Human (Step 1 prototype) — self-contained module, see /particle-human.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
  }
}
</script>
<script type="module" src="./particle-human.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg:#15171a; --bg-2:#1b1e22; --surface:#20242a; --surface-2:#282d34;
  --paper:#efe7d6; --paper-ink:#231f19; --paper-dim:#6c6656;
  --ink:#ece9e2; --ink-dim:#9aa1aa; --ink-faint:#5c636b;
  --line:#33383f; --line-2:#3c424a;
  --left:#57a0b5; --left-bg:#1e343b; --left-strong:#8fcbdc;
  --right:#d4a04a; --right-bg:#3a2e18; --right-strong:#e8c37f;
  --danger:#d1594c; --danger-bg:#2c1917; --danger-line:#5c2c26;
  --ok:#6ba077; --ok-bg:#182420;
  --lock:#6b6f76; --lock-bg:#24262a;
  --accent:#d4a04a;
  --know:#a98ee8; --know-bg:#241f38; --know-line:#3d3466;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;
  min-height:100vh;
}
button{font:inherit; color:inherit;}
.disp{font-family:'Space Grotesk',-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;}
h1,h2,h3,h4{font-family:'Space Grotesk',-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; margin:0; font-weight:600;}
.num{font-family:'Space Grotesk',-apple-system,sans-serif; font-variant-numeric:tabular-nums;}
a{color:var(--right-strong);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

#app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* ---- topbar ---- */
#topbar{
  position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 70%,rgba(21,23,26,0));
  padding:18px 18px 10px;
}
#topbar .eyebrow{font-size:11px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase; font-family:'Space Grotesk',sans-serif; margin-bottom:4px;}
#topbar h1{font-size:22px; letter-spacing:.01em;}
#topbar .sub{font-size:13px; color:var(--ink-dim); margin-top:3px;}

/* ---- main view ---- */
#view{flex:1; padding:4px 16px calc(100px + var(--safe-b)); }
.screen{animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ---- tabbar ---- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:640px; margin:0 auto;
  display:flex; background:rgba(27,30,34,.94); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:7px 2px calc(7px + var(--safe-b));
}
#tabbar button{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:5px 1px; border-radius:12px; color:var(--ink-faint); font-size:10px; letter-spacing:0;
}
#tabbar button .ico{width:19px; height:19px;}
#tabbar button.active{color:var(--right-strong);}
#tabbar button.active .ico{color:var(--right-strong);}

/* ---- cards / primitives ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
.card.paper{background:var(--paper); color:var(--paper-ink); border-color:#ddd2b4;}
.card.paper .ink-dim{color:var(--paper-dim);}
.section-title{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-family:'Space Grotesk',sans-serif; margin:22px 2px 10px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
.section-title:first-child{margin-top:6px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:600; letter-spacing:.01em; font-family:'Space Grotesk',sans-serif;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; font-family:'Space Grotesk',sans-serif;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#241a08;}
.btn.ghost{background:transparent;}
.btn.danger{background:var(--danger); border-color:var(--danger); color:#2c0e0a;}
.btn:active{transform:scale(.97);}
.btn.block{width:100%;}
.btn.sm{padding:8px 12px; font-size:12px; border-radius:9px;}
.iconbtn{background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.muted{color:var(--ink-dim);}
.tiny{font-size:12px;}
hr.hair{border:none; border-top:1px solid var(--line); margin:14px 0;}

/* day-type badges */
.badge-day{padding:5px 11px; border-radius:8px; font-size:12.5px; font-weight:700; font-family:'Space Grotesk',sans-serif; letter-spacing:.02em; white-space:nowrap;}
.dt-上肢A{background:#3a2e18; color:#e8c37f;}
.dt-上肢B{background:#3a2e18; color:#e8c37f;}
.dt-下肢{background:#38251a; color:#e0a074;}
.dt-輕鬆日{background:#1b2b22; color:#8fc79e;}
.dt-打波{background:#3a1e18; color:#e8916f;}
.dt-休息{background:#24262a; color:#9aa1aa;}
.dt-測試日{background:#2a2038; color:#c19bea;}

/* L / R chips */
.lr-wrap{display:flex; gap:8px; margin:10px 0;}
.lr-chip{flex:1; border-radius:11px; padding:9px 11px; border:1px solid var(--line-2);}
.lr-chip.left{background:var(--left-bg); border-color:#2c5561;}
.lr-chip.right{background:var(--right-bg); border-color:#5a441f;}
.lr-chip .lr-label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-family:'Space Grotesk',sans-serif; display:flex; align-items:center; gap:5px; margin-bottom:3px;}
.lr-chip.left .lr-label{color:var(--left-strong);}
.lr-chip.right .lr-label{color:var(--right-strong);}
.lr-dot{width:7px; height:7px; border-radius:50%;}
.lr-chip.left .lr-dot{background:var(--left-strong);}
.lr-chip.right .lr-dot{background:var(--right-strong);}
.lr-chip .lr-val{font-size:14px; font-weight:600;}

/* red flag gate */
.flag-card{background:var(--danger-bg); border:1px solid var(--danger-line); border-radius:var(--radius);}
.flag-card .flag-head{padding:15px 16px 6px; display:flex; align-items:center; gap:8px;}
.flag-card .flag-head h3{color:#f0a89e; font-size:14.5px;}
.flag-items{padding:2px 16px 14px;}
.flag-item{display:flex; align-items:flex-start; gap:10px; padding:8px 0; font-size:13.5px; color:#e9c9c3; border-bottom:1px dashed #4a2622;}
.flag-item:last-child{border-bottom:none;}
.flag-stop{margin:0 16px 15px; background:#3a1c17; border:1px solid #6b332a; border-radius:11px; padding:11px 13px; font-size:13.5px; color:#ffd9d0; font-weight:600; display:none;}
.flag-stop.show{display:block;}
.flag-history{margin:0 16px 14px; padding:9px 11px; background:rgba(0,0,0,.18); border-radius:9px; font-size:12px; color:#e9c9c3; line-height:1.7;}

/* checkbox rows */
.check-row{display:flex; align-items:flex-start; gap:11px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.check-row:last-child{border-bottom:none;}
.check-box{flex:none; width:22px; height:22px; border-radius:7px; border:1.6px solid var(--ink-faint); margin-top:1px; display:flex; align-items:center; justify-content:center; transition:.15s;}
.check-box svg{opacity:0; transform:scale(.5); transition:.15s;}
.check-row.done .check-box{background:var(--ok); border-color:var(--ok);}
.check-row.done .check-box svg{opacity:1; transform:scale(1);}
.check-row.done .check-label{color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--ink-faint);}
.check-label{font-size:14.5px; flex:1; padding-top:1px;}

/* exercise card */
.ex-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:9px; overflow:hidden;}
.ex-card.locked{opacity:.55;}
.ex-top{display:flex; align-items:flex-start; gap:11px; padding:13px 13px 11px; cursor:pointer;}
.ex-num{flex:none; width:24px; height:24px; border-radius:7px; background:var(--surface-2); color:var(--ink-dim); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; margin-top:1px;}
.ex-check{flex:none; width:30px; height:30px; margin:-4px -4px -4px 0; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.ex-check .ex-check-box{width:22px; height:22px; border-radius:7px; border:1.6px solid var(--ink-faint); display:flex; align-items:center; justify-content:center; transition:.15s;}
.ex-check svg{opacity:0; transform:scale(.5); transition:.18s cubic-bezier(.34,1.56,.64,1);}
.ex-card.done .ex-check .ex-check-box{background:var(--ok); border-color:var(--ok); transform:scale(1.04);}
.ex-card.done .ex-check svg{opacity:1; transform:scale(1);}
.ex-card.done .ex-name{color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--ink-faint);}
.ex-body{flex:1; min-width:0;}
.ex-name{font-size:14.5px; font-weight:600; line-height:1.4;}
.ex-tags{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--ink-dim); font-family:'Space Grotesk',sans-serif; letter-spacing:.03em; cursor:default;}
.tag.main{background:#3a2e18; color:var(--right-strong);}
.tag.assist{background:var(--surface-2); color:var(--ink-dim);}
.tag.reset{background:#1b2b2e; color:#8fc7c9;}
.tag.sym{background:var(--know-bg); color:var(--know); cursor:pointer;}
.ex-chevron{flex:none; color:var(--ink-faint); margin-top:3px; transition:transform .15s;}
.ex-card.open .ex-chevron{transform:rotate(90deg);}
.ex-detail{display:none; padding:0 13px 15px 48px;}
.ex-card.open .ex-detail{display:block;}
.ex-cue{font-size:13px; color:var(--ink-dim); line-height:1.7; margin-bottom:10px;}
.ex-meta{font-size:12px; color:var(--ink-faint); line-height:1.8;}
.ex-meta b{color:var(--ink-dim); font-weight:600;}
.ex-flagline{margin-top:8px; padding:8px 10px; background:var(--danger-bg); border:1px solid var(--danger-line); border-radius:8px; font-size:12px; color:#e9b3ab;}
.ex-anklenote{margin-top:8px; padding:8px 10px; background:#2e2412; border:1px solid #5a441f; border-radius:8px; font-size:12.5px; color:var(--right-strong);}
.ex-lockline{margin-top:8px; padding:8px 10px; background:var(--lock-bg); border:1px solid #3a3d42; border-radius:8px; font-size:12px; color:var(--ink-dim);}
.ex-symlink{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap;}

/* toggle */
.toggle{position:relative; width:44px; height:26px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line-2); flex:none; cursor:pointer;}
.toggle .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--ink-dim); transition:.18s;}
.toggle.on{background:#4a3b1c; border-color:var(--right);}
.toggle.on .knob{left:20px; background:var(--right-strong);}

/* form fields */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:7px; font-weight:600;}
.field input[type=number],.field input[type=text],.field select,.field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; color:var(--ink);
  padding:11px 12px; font-size:15px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:56px;}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.seg{display:flex; gap:7px; flex-wrap:wrap;}
.seg button{flex:1; min-width:44px; padding:10px 8px; border-radius:10px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-dim); font-size:13px; font-weight:600;}
.seg button.sel{background:var(--accent); border-color:var(--accent); color:#241a08;}
.scoreband{display:flex; gap:4px;}
.scoreband button{flex:1; aspect-ratio:1; border-radius:7px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-dim); font-size:12px; font-family:'Space Grotesk',sans-serif; font-weight:600; padding:0; min-width:0;}
.scoreband button.sel{background:var(--danger); border-color:var(--danger); color:#fff;}

/* date nav */
.datenav{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.datenav .center{flex:1; text-align:center;}
.datenav .dow{font-size:12px; color:var(--ink-faint);}
.datenav .dt{font-size:16px; font-weight:700; font-family:'Space Grotesk',sans-serif; margin-top:1px;}
.today-jump{text-align:center; margin:-2px 0 12px;}
.today-jump button{background:none;border:none;color:var(--right-strong);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}

/* day type picker (the freedom-to-choose control) */
.daytype-picker{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:2px; -ms-overflow-style:none; scrollbar-width:none;}
.daytype-picker::-webkit-scrollbar{display:none;}
.daytype-pill{flex:none; position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 15px; border-radius:13px; border:1.5px solid var(--line-2); background:var(--surface); color:var(--ink-dim); cursor:pointer;}
.daytype-pill .dtp-name{font-size:13px; font-weight:700; font-family:'Space Grotesk',sans-serif; white-space:nowrap;}
.daytype-pill .dtp-plan{font-size:9px; color:var(--ink-faint); letter-spacing:.02em;}
.daytype-pill.sel{border-color:var(--accent); background:#3a2e18; color:var(--right-strong);}
.daytype-pill.sel .dtp-plan{color:var(--right-strong); opacity:.85;}
.daytype-pill .dtp-dot{position:absolute; top:6px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--right-strong);}
.override-note{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px dashed var(--line-2); border-radius:11px; padding:10px 13px; font-size:12.5px; color:var(--ink-dim); margin-bottom:14px;}
.override-note button{background:none;border:none;color:var(--right-strong);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;flex:none; padding:2px;}

/* one-tap complete hero button */
.complete-hero{width:100%; border:none; border-radius:16px; padding:16px; background:linear-gradient(135deg,#79b389,#5a9169); color:#0c1f11; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; margin-bottom:14px; box-shadow:0 8px 22px rgba(107,160,119,.28);}
.complete-hero .ch-ico{width:21px; height:21px; flex:none; transition:transform .32s cubic-bezier(.34,1.56,.64,1);}
.complete-hero.done{background:var(--surface-2); color:var(--ink-dim); box-shadow:none; border:1px solid var(--line-2);}
.complete-hero:active{transform:scale(.98);}
.complete-hero.pulse .ch-ico{transform:scale(1.35) rotate(-8deg);}

/* tip / insight banner pulled from knowledge base */
.tip-card{display:flex; gap:10px; background:var(--know-bg); border:1px solid var(--know-line); border-radius:13px; padding:12px 13px; margin-bottom:14px; font-size:13px; color:#cabdf0; line-height:1.7;}
.tip-card .tip-ico{flex:none; margin-top:2px; color:var(--know);}
.tip-card b{color:#e2d6ff;}
.tip-card.amber{background:#2e2412; border-color:#5a441f; color:var(--right-strong);}
.tip-card.amber b{color:#f5d99a;}
.tip-card.amber .tip-ico{color:var(--right-strong);}
.tip-card .tip-link{display:block; margin-top:6px; font-size:12px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; color:inherit; opacity:.85;}

/* progress bar */
.progress-wrap{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin:4px 0 2px;}
.progress-bar{height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease;}

/* calendar */
.week-block{margin-bottom:18px;}
.week-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 9px;}
.week-head .wname{font-size:14px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.week-head .wphase{font-size:11px; color:var(--ink-faint);}
.day-list{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
.day-item{display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line); cursor:pointer;}
.day-item:last-child{border-bottom:none;}
.day-item.istoday{background:rgba(212,160,74,.08);}
.day-item .ddate{width:44px; flex:none;}
.day-item .ddate .dnum{font-size:16px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.day-item .ddate .ddow{font-size:10.5px; color:var(--ink-faint);}
.day-item .dinfo{flex:1; min-width:0;}
.day-item .dnote{font-size:11.5px; color:var(--ink-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.day-item .dswap{font-size:10.5px; color:var(--right-strong); margin-top:3px;}
.day-item .dstatus{flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.6px solid var(--line-2); cursor:pointer; transition:transform .12s ease;}
.day-item .dstatus:active{transform:scale(.86);}
.day-item .dstatus.done{background:var(--ok); border-color:var(--ok);}
.day-item .dstatus.future{border-style:dashed; opacity:.5;}

/* library / knowledge filters */
.chipbar{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 14px; -ms-overflow-style:none; scrollbar-width:none;}
.chipbar::-webkit-scrollbar{display:none;}
.chip{flex:none; padding:8px 14px; border-radius:99px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-dim); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
.chip.sel{background:var(--accent); border-color:var(--accent); color:#241a08;}
.chip.sel.know{background:var(--know); border-color:var(--know); color:#1b1530;}
.searchbox{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 14px; color:var(--ink); font-size:14px; margin-bottom:12px;}
.searchbox::placeholder{color:var(--ink-faint);}

/* guide / reference tables */
.def-table{width:100%; border-collapse:collapse; font-size:13px;}
.def-table td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.65;}
.def-table td:first-child{color:var(--right-strong); font-weight:700; white-space:nowrap; width:30%; font-family:'Space Grotesk',sans-serif;}
.def-table tr:last-child td{border-bottom:none;}
details.rationale{border-bottom:1px solid var(--line); padding:12px 0;}
details.rationale:last-child{border-bottom:none;}
details.rationale summary{font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink);}
details.rationale summary::marker{color:var(--right-strong);}
details.rationale .rbody{font-size:13px; color:var(--ink-dim); line-height:1.8; margin-top:9px;}
.redflag-list{list-style:none; margin:0; padding:0;}
.redflag-list li{padding:8px 0 8px 20px; position:relative; font-size:13.5px; line-height:1.6; border-bottom:1px dashed var(--danger-line);}
.redflag-list li:last-child{border-bottom:none;}
.redflag-list li::before{content:"⚑"; position:absolute; left:0; top:8px; color:var(--danger); font-size:12px;}
.cut-table{width:100%; border-collapse:collapse; font-size:13px;}
.cut-table td{padding:9px 6px; border-bottom:1px solid var(--line);}
.cut-table td:first-child{width:28px; color:var(--ink-faint); font-family:'Space Grotesk',sans-serif; font-weight:700;}

/* stat strip */
.statstrip{display:flex; gap:10px; margin-bottom:16px;}
.statbox{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; text-align:center;}
.statbox .sval{font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--right-strong);}
.statbox .slabel{font-size:10.5px; color:var(--ink-faint); margin-top:2px; letter-spacing:.03em;}

.banner{padding:11px 13px; border-radius:11px; font-size:13px; margin-bottom:14px; display:flex; gap:9px; align-items:flex-start;}
.banner.deload{background:#1e2a38; border:1px solid #2c4560; color:#a9c6e8;}
.banner.done{background:var(--ok-bg); border:1px solid #2c4a37; color:#b6dcc0;}
.banner.warn{background:var(--danger-bg); border:1px solid var(--danger-line); color:#f0b3ab;}

.trend-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.trend-row:last-child{border-bottom:none;}
.trend-row .tlabel{width:110px; flex:none; color:var(--ink-dim);}
.trend-row .tvals{flex:1; display:flex; gap:8px; flex-wrap:wrap;}
.trend-row .tv{background:var(--surface-2); padding:3px 9px; border-radius:7px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px;}
.arrow-ok{color:var(--ok);} .arrow-bad{color:var(--danger);}

/* streak strip */
.streak-strip{display:flex; gap:10px; margin-bottom:14px;}
.streak-box{flex:1; background:linear-gradient(160deg,var(--surface),var(--surface-2)); border:1px solid var(--line); border-radius:13px; padding:13px; text-align:center;}
.streak-box .sv{font-size:23px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--right-strong); display:flex; align-items:center; justify-content:center; gap:4px;}
.streak-box .sl{font-size:10.5px; color:var(--ink-faint); margin-top:3px;}

/* symptom overview grid */
.sym-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:4px;}
.sym-card{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 13px; cursor:pointer;}
.sym-card .sc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
.sym-card .sc-code{font-size:10px; letter-spacing:.08em; color:var(--ink-faint); font-family:'Space Grotesk',sans-serif; text-transform:uppercase;}
.sym-card .sc-status{font-size:9px; padding:2px 6px; border-radius:5px; white-space:nowrap; font-weight:600;}
.sym-card .sc-status.st-ok{background:var(--ok-bg);color:var(--ok);}
.sym-card .sc-status.st-watch{background:#3a2e18;color:var(--right-strong);}
.sym-card .sc-status.st-neutral{background:var(--surface-2);color:var(--ink-dim);}
.sym-card .sc-name{font-size:12.5px; font-weight:600; margin:6px 0 8px; line-height:1.4; min-height:32px;}
.sym-card .sc-score{display:flex; align-items:baseline; gap:6px;}
.sym-card .sc-score .num{font-size:23px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.sym-card .sc-score .unit{font-size:10.5px; color:var(--ink-faint);}
.sym-card .sc-score .trend{font-size:11px; font-weight:600;}
.sym-card .sc-date{font-size:10px; color:var(--ink-faint); margin-top:2px;}

/* charts */
.chart-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 14px 12px; margin-bottom:12px;}
.chart-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; padding-top:10px; border-top:1px solid var(--line);}
.chart-legend .lg-item{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-dim);}
.chart-legend .lg-dot{width:8px;height:8px;border-radius:50%; flex:none;}
.bar-chart-row{display:flex; align-items:center; gap:9px; padding:6px 0;}
.bar-chart-row .bcr-label{width:66px; flex:none; font-size:11.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-chart-row .bcr-track{flex:1; height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.bar-chart-row .bcr-fill{height:100%; border-radius:99px; transition:width .3s ease;}
.bar-chart-row .bcr-val{width:44px; flex:none; text-align:right; font-size:11.5px; font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--ink-dim);}
.chart-empty{text-align:center; color:var(--ink-faint); font-size:12.5px; padding:18px 0;}

/* knowledge cards */
.km-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 15px; margin-bottom:10px;}
.km-title{font-size:14px; font-weight:700; line-height:1.5; margin-bottom:8px;}
.km-badges{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:9px;}
.km-badge{font-size:9.5px; padding:2.5px 7px; border-radius:6px; font-family:'Space Grotesk',sans-serif; letter-spacing:.02em; white-space:nowrap; font-weight:600;}
.km-badge.st-現行採用{background:var(--ok-bg); color:var(--ok);}
.km-badge.st-已清零{background:#1e2a38; color:#8fb8e8;}
.km-badge.st-觀察中{background:#3a2e18; color:var(--right-strong);}
.km-badge.st-已完成{background:var(--surface-2); color:var(--ink-dim);}
.km-badge.st-已修正{background:var(--danger-bg); color:#e9b3ab;}
.km-badge.evi{background:var(--surface-2); color:var(--ink-faint);}
.km-badge.cat{background:var(--know-bg); color:var(--know);}
.km-body{font-size:13.3px; color:var(--ink-dim); line-height:1.85; white-space:pre-line;}
.km-foot{display:flex; justify-content:space-between; gap:8px; margin-top:10px; padding-top:9px; border-top:1px solid var(--line); font-size:10.5px; color:var(--ink-faint);}

/* symptom snapshot (compact, used inline in knowledge tab) */
.snap-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.snap-row:last-child{border-bottom:none;}
.snap-row .snap-code{width:26px; flex:none; text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--right-strong);}
.snap-row .snap-name{flex:1; font-size:13px;}
.snap-row .snap-val{font-size:12px; color:var(--ink-faint);}

/* backup / data area */
.backup-area textarea{width:100%; min-height:84px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; color:var(--ink); font-size:11px; font-family:'Space Grotesk',monospace; padding:10px; resize:vertical;}
.sync-area input[type=text],.sync-area input[type=password]{width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; color:var(--ink); font-size:13px; padding:10px 12px; margin-bottom:8px; font-family:'Space Grotesk',monospace;}
.sync-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
.sync-dot.ok{background:var(--ok);} .sync-dot.pending{background:var(--right);} .sync-dot.off{background:var(--ink-faint);} .sync-dot.err{background:var(--danger);}
.backup-row{display:flex; gap:8px; margin-top:9px;}
.backup-row .btn{flex:1;}
.copy-flash{color:var(--ok); font-size:12px; margin-top:7px; display:none;}
.copy-flash.show{display:block;}

.footer-note{text-align:center; color:var(--ink-faint); font-size:11.5px; padding:18px 10px 6px; line-height:1.7;}

/* particle human hero (Step 1 prototype) — canvas is injected into this by /effects/particle-human.js */
.particle-hero{
  position:relative;
  height:clamp(180px, 40vw, 240px);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:14px;
  background:
    radial-gradient(60% 70% at 50% 38%, rgba(66,245,167,.05), transparent 70%),
    #0A0A0C;
  border:1px solid rgba(66,245,167,.08);
  isolation:isolate;
}
</style>

const KNOWLEDGE = [{"分類": "理論基礎", "順序": 1, "主題": "PRI 左AIC/右BRC 模型是什麼", "對應狀況": "通用原則", "內容": "這套系統假設你的骨盆與胸廓因為長期使用模式（右手投籃、左腳起跳支撐、長期右側變向探步）產生了固定的旋轉代償：骨盆整體右旋（右骨盆前傾內旋、左骨盆後旋外展），軀幹向右旋轉（左前肋外翻卡在無法下降的吸氣位、右後側胸廓被壓縮扣死）。這個框架用來解釋你五大狀況（A-E）為什麼會同時出現、而且都偏向身體同一側，是整套課表的底層假設。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §一、§三"}, {"分類": "理論基礎", "順序": 2, "主題": "這套理論的證據強度到底有多強", "對應狀況": "通用原則", "內容": "PRI 的核心解剖前提（右側橫膈膜腳較長較大、肝右心左、骨盆左右不對稱在人群中確實常見）有解剖事實支撐；但「幾乎所有人都是同一個模式」以及「呼吸訓練可以重新定位骨盆」這兩個核心主張，主要靠機轉推論與個案系列支持，缺乏高品質 RCT。體態學界近二十年的共識是：靜態姿勢與疼痛的相關性遠比想像中弱。但重要的是：這份課表跑出來的具體處方——單邊負重矯正力量差、前鋸肌強化處理肩胛動作異常、呼氣導向呼吸壓低肋骨、對已被拉長卻緊繃的肌肉做向心收縮而非被動拉筋——幾乎每一條都能被 PRI 以外的獨立證據支持。地圖可能不準，路線卻大致正確。實務含意：繼續做這套課表沒問題，但如果日後要寫成果報告或案例分享，不要把身體改善全部歸因於「骨盆回正」，因為鍵盤移位、整體肌力提升、負荷管理、自然病程都是同樣合理的解釋，混在一起沒辦法分離變量。", "證據強度": "獨立實證支持（處方層面）／機轉推論（框架層面）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "—"}, {"分類": "理論基礎", "順序": 3, "主題": "重設動作在練什麼", "對應狀況": "通用原則", "內容": "90/90 呼吸、不對稱貓牛、靠牆滑行這些動作的作用機制，是用「閉鏈姿勢＋可控呼吸」暫時把肋骨與骨盆帶到中線位置，讓神經系統重新學習這個位置是安全的、可以被主動控制的——不是物理上把骨頭扳正。這個效果是暫時且需要重複疊加的，這正是為什麼它排在「每日」而不是「一次性治療」，也是為什麼它不能被「訓練前隨便做做」取代。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⓪重設全套"}, {"分類": "症狀解析", "順序": 1, "主題": "狀況 A：左肩胛翼狀 — 機制已修正", "對應狀況": "A肩胛翼狀", "內容": "原假設：左肋外翻導致左前鋸肌長期拉長罷工，左下斜方代償。本次討論（8/4）修正了機制：辦公姿勢下右手長期在上（滑鼠）、左手長期在下（鍵盤在抽屜），讓左肩胛長期處於「內收下沉」的功能相反位置。更準確的機制是「長期不在功能發力角度，導致神經募集效率下降」，不是單純的物理拉長——「拉長」和「無力」是兩件不同的事，可能相關但不能直接畫等號。目前左手 20kg 空槓做單臂地雷管推舉已經很穩固，代表前鋸肌剛性已初步建立。", "證據強度": "機轉推論（已修正一次）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 上肢A #1"}, {"分類": "症狀解析", "順序": 2, "主題": "狀況 B：左頸麻 — 已清零，但要用測試結案", "對應狀況": "B左頸麻", "內容": "原成因：左前肋上飄頂起左側前斜角肌與胸鎖乳突肌，頭轉向右上方時兩端極端拉長，壓迫臂神經叢。鍵盤從抽屜移到桌面後，這是目前唯一一個已經被有實證支持的人因工程介入直接解決的狀況。但「感覺沒事」不算數，要用測試確認：①上肢神經張力測試（ULTT，正中神經向）——手臂外展90°、肘伸直、腕背屈，頸部往對側側屈，兩側牽拉感對稱且無麻電才算清零，已通過；②Roos/EAST 三分鐘——三分鐘內不誘發左側麻/酸/沉重才算陰性，已通過（頸不麻）。", "證據強度": "用戶數據驗證", "狀態": "已清零", "已消化": "", "最後更新": "2026-08-04", "相關位置": "3_測試記錄 8/3 列"}, {"分類": "症狀解析", "順序": 3, "主題": "狀況 C：左髕腱 — 動作描述已更正，機制方向不變", "對應狀況": "C左髕腱", "內容": "原始描述是「半跪後傾」，8/4 更正為「站立、微屈膝（膝不觸地）、身體後傾」，這個特殊角度下才會有拉扯痛，並延伸到膝蓋外側。機制：這個姿勢重心後移，地面反作用力落在膝關節後方，產生屈膝力矩，股四頭必須離心對抗；同時髖被推向伸展，跨兩關節的股直肌在髖端被拉長、膝端出力。這跟原假設「左髖缺乏主動伸展，離心力繞過髖砸在髕腱」方向一致，訓練邏輯不變（已新增單腳橋式直接補主動髖伸展）。但「延伸到膝蓋外側」這個細節要單獨標注：純粹的髕腱本體病變通常集中在髕骨下極，不太會放射到外側；放射到外側可能牽涉髂脛束或外側支持帶的張力參與，這需要手觸診才能鑑別，不是靠描述能判斷的。", "證據強度": "機轉推論", "狀態": "觀察中", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 下肢日 #3"}, {"分類": "症狀解析", "順序": 4, "主題": "狀況 D：右髖彈響 — 目前安靜", "對應狀況": "D右髖彈響", "內容": "成因：右骨盆習慣前傾下掉，導致深層右髂腰肌長期縮短緊繃且軌道歪斜，反覆摩擦髂恥隆起。同時存在一個上下端力學矛盾：右骨盆在靜態結構上是內旋/內收（前傾下掉），但打籃球時右腳強行做出外旋/外展的動態切入代償，這種「扭乾毛巾剪力」是右膝晃動、右髖彈響的元兇。最近一場高強度比賽賽後，右腹出現「良性神經抽動疲勞感」隨後消失，判斷為核心自動觸發回正對抗後的正常反應，不是惡化信號。", "證據強度": "機轉推論", "狀態": "觀察中", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 下肢日 #8 側躺髖外展"}, {"分類": "症狀解析", "順序": 5, "主題": "狀況 E：左內收肌 — 可能不是內收肌本身的問題", "對應狀況": "E左內收肌", "內容": "原假設：左骨盆往後往外開，把左內收肌硬拉長，產生保護性痙攣（偽緊繃），所以 100% 禁止被動拉筋，只做左側躺內收抬高的向心收縮去縮短這條「橡皮筋」。8/4 你提出新解釋：落下測試落不下去，是臀部肌肉卡住你，左右不同是骨盆位置造成的。這個推論很可能是對的，而且後果不小——如果限制來自髖關節囊或骨性結構（包括每個人天生不同、練不動的股骨扭轉角度差異），那再多內收肌訓練或拉筋都不會讓它落得更深，硬壓只會激怒關節而不是「鬆開」它。已在測試流程加入震盪判別步驟來分辨這兩種可能。", "證據強度": "機轉推論（新增，待8/24驗證）", "狀態": "觀察中", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #5"}, {"分類": "症狀解析", "順序": 6, "主題": "左後肩／大小圓肌酸 — 是耐力不足，不是張力過高", "對應狀況": "左後肩酸", "內容": "Roos/EAST 三分鐘測試出現的酸，是對大小圓肌、背闊肌、後三角、下斜方的等長耐力測試，不是胸廓出口症候群的陽性徵象（那要看麻/電/沉重/發白）。上一版建議用按摩球放鬆腋下和肩胛外側，是把「容量不足」當成「張力過高」在處理——按完當下鬆幾小時，下次三分鐘還是一樣酸，因為組織容量沒有改變。這跟左小腿只揉不練是同一個錯誤的第二次出現。正解是負荷：肩胛上旋訓練＋後旋轉肌耐力訓練。重設動作已把「左腋下大圓肌」從按摩清單移除，改用側躺外旋＋靠牆滑行頂點前伸來直接練這個容量。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 上肢A #4、⓪重設#5"}, {"分類": "辦公環境", "順序": 1, "主題": "電腦桌不對稱姿勢的力學分析", "對應狀況": "A肩胛翼狀,左後肩酸", "內容": "螢幕偏右、太近、太低，逼你縮脖子看；同時因為所有東西都在右側，你會把椅子轉向左（下半身指向左），但上半身轉向右去用滑鼠、頭也右轉看螢幕，右手長期在上（滑鼠）、左手長期在下（鍵盤在抽屜）。這個姿勢跟訓練裡的「不對稱貓牛式」方向剛好相反：貓牛式是主動、短時（15分鐘）把左肩胛帶到正確位置；辦公姿勢是被動、長時（6-10小時）把身體鎖在原本代償模式裡。兩者不是同一個量級的對手——任何訓練刺激的劑量都追不上這個時長差距。這是目前整套系統裡改動成本最低、影響最大的槓桿點，已列為 Priority 0。", "證據強度": "機轉推論", "狀態": "現行採用，已開始改造", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §八"}, {"分類": "辦公環境", "順序": 2, "主題": "頸胸交界酸痛是獨立問題，不要塞進同一個框架", "對應狀況": "通用原則", "內容": "縮脖子看螢幕造成的頸胸交界處（約C7-T1）酸痛，主要來自頭前引/低頭視線角度對深層頸伸肌群的持續等長負荷，這在辦公人群中極常見。這跟 AIC/BRC 不對稱模式是兩條獨立的問題線，不需要也不應該被塞進同一個大理論框架裡解釋——不是所有身體不適都要用同一套模型解釋，過度歸因反而會讓你忽略真正該改的環境因素（螢幕高度與距離）。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §八"}, {"分類": "測試方法", "順序": 1, "主題": "單臂划船 8RM 左右差測試", "對應狀況": "通用原則", "內容": "找出左右手各自「只能做8下」的重量，從輕試起每次加2kg，中間休息3分鐘。左右差% = (右手8RM－左手8RM)÷右手8RM×100。8/3實測左27.5kg／右30kg，差8.3%，低於10%門檻——意義是：你左側的問題不是力量，是控制、耐力和位置，原本假設左側大幅落後，數據不支持這一點。但規則是「連續兩次」都<10%才降低左側容量，因為單次測試可能是狀態好或抓重不準造成的假象。", "證據強度": "用戶數據驗證", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #1、3_測試記錄"}, {"分類": "測試方法", "順序": 2, "主題": "單腳 RDL 測試 — 測法已修正", "對應狀況": "C左髕腱", "內容": "英文名稱：Single-Leg RDL 或 Single-Leg Hip Hinge，接近的標準化版本是 Single Leg Toe Touch Test、Y-Balance Test 的 posteromedial reach。舊測法（量腳尖到手摸到的位置之間的距離）8/3實測左30cm（只摸到小腿）／右24cm（摸到腳踝內側）——在這個定義下數字越小代表摸得越低、越好，所以右邊表現比左邊好，這其實跟「左髖伸展不足」假設是一致的（先前一度誤讀成矛盾，已更正方向）。但這個測法本身重複性太差，會隨你摸到哪個部位而跳動，已改為「量指尖最低點離地幾cm」，數字越小越好，兩邊都用對側手（左腳站用右手），並加碼用手機側面錄影，看下降過程中腰椎是否在髖還沒到極限前就先代償拱起——哪一側先代償，哪一側才是真的差，跟摸到哪裡無關。", "證據強度": "機轉推論＋用戶數據", "狀態": "現行採用（測法已改）", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #2"}, {"分類": "測試方法", "順序": 3, "主題": "靠牆滑行測試", "對應狀況": "A肩胛翼狀", "內容": "背貼牆、肋骨壓下，雙手沿牆滑到頭頂，記左肋有沒有外翻。這是決定能不能從 Phase 1 進到 Phase 2 的唯一門檻。8/3 結果是「是」（外翻），所以目前鎖在 Phase 1，斜板俯臥 Y 和 Face Pull 一項都不做，要先把這個「是」變成「否」。", "證據強度": "用戶數據驗證", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #3、00_總指南 §三"}, {"分類": "測試方法", "順序": 4, "主題": "Roos／EAST 三分鐘測試 — 要分辨酸跟麻", "對應狀況": "左後肩酸,B左頸麻", "內容": "雙手投降姿勢開合拳三分鐘。關鍵是分辨「酸/攰」跟「麻/電/沉重/發白」——這兩者在這個測試裡意義完全相反：麻/電/沉重/發白＝血管神經受壓的陽性徵象；左肩胛下方/大小圓肌/背闊肌上緣發酸＝肌肉耐力不足，是一條長期不擅長維持上旋位的肩胛，撐三分鐘會酸，完全在預期之內。8/3測試結果：頸不麻（陰性，狀況B清零成立），但左肩胛下方會酸——這點過去曾被誤判方向、建議按摩處理，實際上該用負荷訓練解決。", "證據強度": "機轉推論＋用戶數據", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #4"}, {"分類": "測試方法", "順序": 5, "主題": "內收肌落下測試 ＋ 震盪判別", "對應狀況": "E左內收肌", "內容": "仰躺，一腳伸直不動，另一腳屈髖屈膝90°，讓大腿往外自然放鬆落下（不要用力壓），記落到多低（幾個拳頭高，數字越小越鬆）。8/3結果左3拳／右2拳，跟狀況E評分6分一致。新增震盪判別步驟：落到極限後做3-5次小幅度「主動收縮再放鬆」微晃動——能多落一點＝軟組織限制（可訓練，繼續做）；完全沒變化、像撞硬邊界＝關節囊或骨性限制（這就是你的天花板，不要追求更深，硬壓只會激怒關節）。", "證據強度": "機轉推論（震盪判別待8/24驗證）", "狀態": "現行採用（新增判別步驟）", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 ⑦測試日 #5"}, {"分類": "訓練規則", "順序": 1, "主題": "三階段框架為什麼要分開", "對應狀況": "通用原則", "內容": "Phase 1 補洞（W1-4）：補下肢、補後肩耐力、修正輕鬆日、開啟過頂階梯，左4-5組/右3組，全面倒轉呼吸。Phase 2 左側力量化（W5-8）：解決「控制很好但一直很弱」的問題，主項改常規支撐、可以真的加重，倒轉呼吸退到副項，解封斜板俯臥Y與Face Pull。Phase 3 收斂回球場（W9-12）：左右容量拉平成4/4，加入落地與彈跳重建。分階段的原因：倒轉呼吸是動作控制工具，不是力量工具，它讓你無法使用重負荷需要的軀幹支撐（Valsalva）——跑四週建立模式是對的，但跑十二週你會得到一條「動作很漂亮但推不動東西」的左手，Phase 2就是刻意把這個限制放出來。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §三"}, {"分類": "訓練規則", "順序": 2, "主題": "技術性力竭 — 凌駕 RPE 的核心紀律", "對應狀況": "通用原則", "內容": "動作品質一走樣就停，不是做到做不動。硬撐的那幾下，招募的正是你想移除的代償模式，對運動控制導向的課表而言是必須遵守的鐵律。這條規則凌駕RPE數字——就算RPE只到6、7，動作一走樣立刻停；反過來，RPE到8、9但動作依然乾淨，可以繼續。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §二"}, {"分類": "訓練規則", "順序": 3, "主題": "過頂階梯 — 決定何時「正常做 gym」", "對應狀況": "B左頸麻", "內容": "四階進程：①單臂啞鈴過頂支撐30秒→②單臂過頂行走20步→③半跪單臂啞鈴推舉→④站姿單臂啞鈴推舉。每階至少停留兩週，出現任何麻感立刻退回上一階。到第4階代表神經症狀已經穩定清零，可以說自己「正常做gym」了。8/3測試填的是第1階，這是保守但必要的起點，因為狀況B剛清零不久。", "證據強度": "機轉推論", "狀態": "現行採用（第1階）", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 上肢A #3、00_總指南 §五"}, {"分類": "訓練規則", "順序": 4, "主題": "打波是生活選擇不是課表，砍除有優先順序", "對應狀況": "通用原則", "內容": "打波不是排定的訓練，是你的生活；你選擇打，它就按下肢高強度日計量，因為兩小時的反向刺激加上最高受傷風險，需要對應的恢復預算。腳踝還在撞骨、還會痛的那週不要打——這是全套系統裡唯一一個「不練會更好」的項目。時間或精力不夠時的砍除順序：①打波（省最多恢復量、風險降最多）②一個上肢日（左右差已<10%，容量沒想像中緊急，留一個就好）③輕鬆日（只值20分鐘，最後才砍）。永不砍：下肢日（腳踝需要的東西＋北歐腿彎舉都在這）、每日15分鐘重設（在家做，不需要器材體力，就算一整週沒去gym也要做）。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 隨身鐵律"}, {"分類": "決策紀錄", "順序": 1, "主題": "8/3 基準測試與當日決策", "對應狀況": "通用原則", "內容": "完成6項測試：划船8RM左27.5/右30（差8.3%）；靠牆滑行左肋外翻=是；EAST頸不麻但左肩胛下方酸；內收肌落下左3/右2拳；過頂階梯第1階。當晚判斷「測試不算重訓練」，加做上肢A縮減版（砍箱深蹲、農夫行走），因為當時已發現左腳踝新症狀，這兩項都會壓迫左腳踝。", "證據強度": "用戶數據", "狀態": "已完成", "已消化": "", "最後更新": "2026-08-04", "相關位置": "3_測試記錄 8/3列、1_訓練日曆與日誌 row0"}, {"分類": "決策紀錄", "順序": 2, "主題": "8/4 左腳踝新症狀處理", "對應狀況": "左腳踝", "內容": "描述為外側痛＋轉動時撞骨＋腳尖上提伸直有撞擊感＋7/30打球後至今未癒（已超過4天），跟原本「假性拗柴感」（揉小腿外側可消除的張力性感覺）性質不同，屬於新的、有機械性卡頓的症狀，AI無法隔著螢幕判斷。設定紅旗：有腫脹／走路避痛／踝有卡住或軟腳瞬間／10天內未改善，中任一項就去看骨科或物理治療師，別拖。在確認之前，下肢日與打波日都已設計對應的替代版本。", "證據強度": "機轉推論（需臨床確認）", "狀態": "觀察中", "已消化": "", "最後更新": "2026-08-04", "相關位置": "01_課表卡 開頭紅旗檢查、下肢日🦶版"}, {"分類": "決策紀錄", "順序": 3, "主題": "8/4 辦公桌力學分析與槓桿點確認", "對應狀況": "A肩胛翼狀,左後肩酸", "內容": "三方會診結論：辦公姿勢是目前系統性價比最高的改動——訓練刺激一天15-60分鐘，辦公姿勢一天6-10小時，任何動作的刺激量都追不上這個時長差距。決定不新增橫向前鋸肌訓練（現有地雷管推舉與Cable高位下壓推胸在動作末端已經要求肩胛前伸，功能向量已覆蓋前鋸肌的前伸/上旋方向），優先處理環境：螢幕居中、抬高、拉遠，鍵盤上桌，滑鼠靠中線。", "證據強度": "機轉推論", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §八"}, {"分類": "決策紀錄", "順序": 4, "主題": "8/4 第四個資料庫「知識手冊」建立", "對應狀況": "通用原則", "內容": "在原有訓練日曆、動作庫、測試記錄三個資料庫之外，新增這個知識手冊資料庫，用途是「學習」而非「執行」——課表卡管「做什麼」，這裡管「為什麼」。設計為兩個角色協作：資料整理師負責排版分類讓 Notion 好查；內容管理負責隨訓練進展持續新增/更新知識卡（例如每次測試日後、每次症狀有新發現時）。之後每次有新的測試結果或決策，都會在「決策紀錄」分類下新增一行，其他分類的既有知識卡如果被更新的理解推翻，會在「狀態」欄改成「已修正」並保留舊版說明，不會直接刪除。", "證據強度": "—", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-04", "相關位置": "00_總指南 §九（新增）"}, {"分類": "訓練規則", "順序": 5, "主題": "北歐腿彎舉的實證基礎：「降五成」這個數字本身也有爭議", "對應狀況": "通用原則", "內容": "北歐腿彎舉之所以在下肢日排在主項而不是可有可無的副項，背後有具體數字支撐。van Dyk、Behan 與 Whiteley 2019 年發表在 British Journal of Sports Medicine 的系統回顧與統合分析，彙整 8459 名運動員的資料，發現包含北歐腿彎舉的傷害預防計畫可以把腿後肌拉傷風險降低約五成（風險比約 0.49，95% 信賴區間 0.32 至 0.74）。這個機制主要來自離心力量的提升：北歐腿彎舉逼迫腿後肌在拉長狀態下持續出力，這正是短跑後擺相、急停變向這類動作造成拉傷的典型受力模式，跟一般坐姿腿彎舉這種向心為主的訓練所刺激到的能力不同。但這個「降五成」的說法在 2021 年被 Impellizzeri、McCall 與 van Smeden 三人在 Journal of Clinical Epidemiology 上重新檢驗。他們只保留隨機對照試驗、改用更嚴謹的統計方法重新分析同一批研究，結論是現有證據其實不確定，北歐腿彎舉的保護效果頂多算有條件推薦，原因包括納入研究的偏誤風險偏高、效果量在不同研究間差異很大，且大多數證據來自足球員這個單一族群，能否推論到籃球或其他項目仍不明朗。兩篇文章對同一批原始數據的解讀出現分歧，反映的是統合分析對統計方法本身的敏感度，不是北歐腿彎舉這個動作被證明無效。實務上這個爭議不太影響你現在的做法：北歐腿彎舉同時有紮實的離心力量與股二頭肌束長度增長證據，這兩點在兩篇文章裡都沒有分歧，這兩項本身就是合理的訓練目標，傷害風險降低與否只是額外的預期效益，不是唯一理由。職業層級的資料也支持這個方向。UEFA精英俱樂部傷害研究追蹤歐洲頂級男子足球俱樂部，2022年那份報告發現，把北歐腿彎舉排進全隊團體訓練的球隊，一季平均每隊5次腿後肌傷害，只用在個別球員身上的球隊平均11次，傷害負擔（缺賽天數／千小時）12天對35天，兩組差距都達統計顯著。同一研究團隊2023年針對女子職業足球的報告方向一致，團體訓練組比賽中腿後肌傷害發生率1.4對4.0。這兩份都不是實驗室研究，是直接追蹤真實職業聯賽球隊整季下來的結果，跟打球的情境比實驗室數字更貼近，只是基於保護球隊資料，公開報告裡不會寫出是哪幾支俱樂部。", "證據強度": "獨立實證支持（力量與肌束長度適應）／證據存在方法學爭議（傷害風險降低幅度）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-23", "相關位置": "01_課表卡 下肢日 #2 北歐腿彎舉"}, {"分類": "訓練規則", "順序": 6, "主題": "減量週的科學：超代償有生理基礎，但「規律砍半」本身的直接證據沒有想像中穩固", "對應狀況": "通用原則", "內容": "課表把 W4／W8／W12 設成減量週，理論基礎是超代償模型：訓練造成的疲勞先讓表現短暫下滑，隨後恢復期讓身體適應並反彈到比訓練前更高的水準，減量週的功能是給這個反彈足夠的空間，這也是課表卡那句「不是在練的時候變強，是在恢復的時候變強」的出處。這個機轉本身有紮實的生理學基礎，功能性超補償與非功能性超補償、過度訓練症候群之間的區別，也是運動生理學界的共識框架。但要注意這個機轉推論跟「規律地每四週砍半」這個具體操作是否真的能提升力量或肌肥大成果，是兩個層次的問題，後者的直接證據其實比一般想像中薄弱。Coleman 等人 2024 年發表在 PeerJ 的隨機對照試驗，在一群已有訓練經驗者的九週訓練計畫中間插入一週完全停練，結果減量組在下肢等長與動態力量的進步反而不如全程持續訓練組，肌肥大和肌耐力兩組沒有差異，減量組主觀的痠痛感與訓練動機確實有小幅改善，但研究者自己也說這個心理層面的差異大小有限、實務意義存疑。另一份針對減量實務的文獻回顧也指出，長時間高量高強度訓練後如果不減量，發生非功能性超補償的風險其實偏低，直接比較減量、完全停練、持續訓練這三者的高品質證據仍非常有限。這不代表該取消減量週，因為這套課表的減量週剛好卡在測試日前一天，它更直接的功能是讓測試當天的數字不被前一天的疲勞污染，這個理由本身站得住，不需要額外的超代償證據撐腰。真正該存疑的是「這樣做一定會讓你進步更快」這個更強的因果宣稱，目前的實證只到「有生理學上合理的機轉，加上專家共識支持」這個強度，還沒到「多篇高品質隨機對照試驗證實」的強度。把減量週寫進課表變成鐵律而不是選項，健力圈最著名的實例是Jim Wendler的5/3/1系統。Wendler是西岸槓鈴出身的職業健力選手，官方紀錄是用650磅的訓練最大重量拉起710磅比賽成績，2005年因為長期高強度訓練把身體練壞了才回頭設計這套刻意保守的系統。5/3/1的結構是三週漸進、第四週強制減量，降到訓練最大重量的40%到60%且不做力竭組，Wendler自己在訓練論壇上講得很直接，大意是他強烈建議每四週減量一次，因為這讓身體和心理都能休息，不會因此變弱，如果覺得變弱了，那是心理作用。這句話剛好可以拿來跟前面Coleman 2024年那篇隨機對照試驗對照著看，一個是被健力圈驗證了將近二十年的實務智慧，一個是嚴謹但樣本有限的單一研究，兩者結論方向不完全一致，這正是實務經驗和受控實驗常有落差的典型例子，不代表哪一邊一定錯，只代表這件事還沒有定論。", "證據強度": "機轉推論（超代償框架）／直接證據有限甚至相反（規律減量對已訓練者力量增長的效果）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-23", "相關位置": "00_總指南 §二 名詞對照表「減量週」、01_課表卡 隨身鐵律"}, {"分類": "訓練規則", "順序": 7, "主題": "為什麼認定按摩球在治標：被動放鬆和主動負荷各自能改變什麼，有分工", "對應狀況": "通用原則", "內容": "左後肩酸和左小腿這兩個狀況都出現過同一個判斷：按摩球或揉捏只能改變當下幾小時的感覺，改變不了真正的組織容量，所以解方要換成負荷訓練。這個判斷不是憑感覺下的。肌筋膜放鬆、滾筒、按摩對關節活動度的效果，在文獻上有相對一致的模式：單次放鬆確實能立即提升活動度與壓痛閾值，但這個效果消退得很快，一份針對膝伸肌群的研究量到放鬆後的活動度與組織硬度改變大約能維持 20 到 60 分鐘，力量本身則幾乎不受影響。更關鍵的是短期介入本身也拉不長效果：一篇統合分析比較滾筒訓練四週以內和四週以上的效果，發現只有超過四週的介入才觀察到活動度有統計上顯著的進步，四週以內的介入效果量小到不顯著；同一批作者針對滾筒訓練對運動表現的統合分析，更是完全沒有找到滾筒訓練優於對照組的證據。這些發現合起來說明的是同一件事：放鬆類手段動的是當下的痛覺閾值與組織的暫時延展性，動不到肌肉在特定角度、特定耐力區間的實際輸出能力，這正是左後肩那個「撐三分鐘會酸」的耐力缺口，以及左小腿長期緊繃感背後真正要補的東西。負荷訓練，也就是側躺外旋、靠牆滑行頂點前伸、比目魚肌等長這幾項的邏輯，才是在直接對組織的做功能力加量，效果才留得住。這不代表按摩球完全沒用，急性痠痛時拿來暫時降低不適仍合理，只是不該把它當成解決長期緊繃或耐力不足的主要工具。這一條沒有像前面幾張卡那樣有單一個某選手或某支球隊採用後怎麼樣的故事，因為它談的是一個否定性的發現，滾筒和按摩本身效果有限，很難找到因為採用了它而顯著改善的成功案例，只能找到證明它效果沒有想像中大的統合分析。這個差異本身也是一個訊號，真正有效的介入通常會留下具體的採用案例和可查證的數字，像北歐腿彎舉、5/3/1那樣；效果薄弱的介入則多半只留下大量個人使用心得和商業行銷內容，卻缺乏團隊或選手層級長期追蹤後的具體數字，這正是判斷一個方法到底有沒有實證支持時，一個很實用的旁證。", "證據強度": "獨立實證支持（放鬆手段對活動度與力量的效果範圍及持續時間）／機轉推論（套用到左後肩與左小腿這兩個具體狀況的判斷）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-23", "相關位置": "01_課表卡 ⓪重設#5、上肢A #4；00_總指南 §九-4"}, {"分類": "理論基礎", "順序": 4, "主題": "RPE／技術性力竭當作訓練劑量開關，這把尺本身有多準", "對應狀況": "通用原則", "內容": "課表卡幾乎每個主項動作都寫 RPE，00_總指南把它定義成還能多做幾下的主觀量尺，這其實就是肌力訓練圈通稱的 RIR（repetitions in reserve，保留次數）量表，最早由 Zourdos 等人 2016 年發表在 Journal of Strength and Conditioning Research 上提出並驗證。他們讓 29 名蹲舉者在 60%、75%、90%、100% 1RM 各做一次，比對主觀 RPE 和實際動作速度，發現兩者呈現很強的負相關，有經驗者 r 約負 0.88，新手 r 約負 0.77，代表這把尺確實在追蹤真實的出力強度。後續 Helms 等人 2018 年的隨機對照試驗，讓兩組人分別用 RPE 或用固定 %1RM 排課表練八週深蹲和臥推，兩組的力量與肌肉厚度增長沒有顯著差異，等於直接證明用 RPE 排課表跟用死板的百分比排課表一樣有效。但這把尺的準頭有個很具體的限制：Steele 等人 2017 年的研究找了 141 人測試預測自己還能做幾下到力竭的準確度，發現有訓練經驗者平均會少估 1 到 2 下，新手會少估 4 到 5 下，意思是就算覺得自己已經逼近力竭，實際上通常還有更多保留，而且離力竭越遠、次數越多、強度越低，估計就越不準。這對現在的用法有兩點直接意義。第一，課表卡的高強度日目標是 RPE7 到 8，這個範圍離真正的力竭還有 2 到 3 下的緩衝，剛好落在準確度相對較高的區間，不用太擔心抓不準。第二，技術性力竭即停這條鐵律本身就是在繞開 RPE 準確度的問題，因為它用的是可以客觀觀察的動作走樣當停止訊號，不完全依賴主觀的力竭感，這也是為什麼它被課表卡定位成凌駕 RPE 數字的更高位規則。這套量尺不是先有理論才拿去現場驗證，順序是反過來的。發明這個用法的是IPF（國際健力總會）冠軍、美國健力教練Mike Tuchscherer，他2008年出版《Reactive Training Manual》，把還剩幾下寫成正式的訓練變數，那時候學界根本還沒有相關實證研究，純粹是他自己比賽準備時發展出來的土法。這套用法在健力圈口耳相傳了將近十年，直到2016年Zourdos那篇論文才正式拿進實驗室驗證。Tuchscherer教練生涯15年帶過400多名選手，其中16人拿過IPF Classic世界錦標賽獎牌。這個先有實務、後有科學驗證的順序，回答了為什麼課表卡敢把RPE當成主要劑量工具而不是等更多研究出來才用，因為它從一開始就是為了解決真實訓練現場的問題而生的，不是實驗室產物。", "證據強度": "獨立實證支持（RPE 與客觀強度的相關性、RPE 排課表的訓練效果）／機轉推論（RPE 準確度隨強度與訓練經驗變化的具體應用）", "狀態": "現行採用", "已消化": "", "最後更新": "2026-08-23", "相關位置": "00_總指南 §二 名詞對照表「主項RPE」「技術性力竭」"}, {"分類": "理論基礎", "順序": 5, "主題": "單邊訓練為什麼能 function pad2(n){ return (n<10?'0':'')+n; }

function keyToDate(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetweenKeys(a,b){ return Math.round((keyToDate(b)-keyToDate(a))/86400000); }

  const m = String(s).match(/^(\w+)\s+(\d+),\s+(\d+)$/);
  if(!m) return null;
  return dateKey(new Date(parseInt(m[3],10), MONTHS_EN[m[1]], parseInt(m[2],10)));
}

/* ================= symptom cross-reference =================
   Exercise 對應狀況 uses short codes (A/B/C/D/E, 左後肩, 左腳踝, 左小腿, 全部).
   Knowledge 對應狀況 uses compound labels (A肩胛翼狀, B左頸麻...).
   normSymCode() maps both into one shared vocabulary so exercise <-> knowledge
   <-> daily score fields can all cross-link. */
function normSymCode(raw){
  var s = String(raw||'').trim();
  if(!s || s==='—') return null;
  if(/^A/.test(s)) return 'A';
  if(/^B/.test(s)) return 'B';
  if(/^C/.test(s)) return 'C';
  if(/^D/.test(s)) return 'D';
  if(/^E/.test(s)) return 'E';
  if(s.indexOf('左後肩')!==-1) return '左後肩';
  if(s.indexOf('腳踝')!==-1 || s.indexOf('踝')!==-1) return '左腳踝';
  if(s.indexOf('小腿')!==-1) return '左小腿';
  if(s.indexOf('全部')!==-1 || s.indexOf('通用')!==-1) return '通用';
  return s;
}
function symCodesOf(field){
  return String(field||'').split(',').map(function(s){ return normSymCode(s); }).filter(Boolean);
}

/* ================= storage (Claude artifact storage -> localStorage -> memory) ================= */
const STORE = {
  mode: 'memory',
  async get(key){
    try{
      if(typeof window.storage !== 'undefined' && window.storage){
        const r = await window.storage.get(key);
        STORE.mode = 'claude';
        return r ? r.value : null;
      }
    }catch(e){ /* fall through */ }
    try{
      const v = localStorage.getItem('atr_'+key);
      if(v !== null) STORE.mode = 'local';
      return v;
    }catch(e){ return null; }
  },
  async set(key, value){
    let ok = false;
    try{
      if(typeof window.storage !== 'undefined' && window.storage){
        const r = await window.storage.set(key, value);
        if(r){ STORE.mode = 'claude'; ok = true; }
      }
    }catch(e){ /* fall through */ }
    if(!ok){
      try{ localStorage.setItem('atr_'+key, value); STORE.mode = (STORE.mode==='claude')?'claude':'local'; ok = true; }catch(e){}
    }
    return ok;
  }
};

/* pendingScope/pendingKey let scheduleSave know which single date-entry just
   changed, so the sync layer can push/merge that one row instead of the
   whole blob (see SYNC module below). A save with no scope/key (e.g. bulk
   restore-from-backup) falls back to pushing everything. */
function scheduleSave(scope, key){
  if(scope && key){
    var obj = (scope==='test') ? state.testLogs[key] : state.dayLogs[key];
    if(obj) obj._updatedAt = new Date().toISOString();
  } else if(scope==='settings'){
    state._settingsUpdatedAt = new Date().toISOString();
  }
  if(state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(function(){ persistAll(scope, key); }, 450);
}
async function persistAll(scope, key){
  try{ await STORE.set('training-log', JSON.stringify(state.dayLogs)); }catch(e){}
  try{ await STORE.set('test-log', JSON.stringify(state.testLogs)); }catch(e){}
  try{ await STORE.set('settings', JSON.stringify({ankleMode: state.ankleMode})); }catch(e){}
  // push to Supabase (offline-queued if unreachable) — see SYNC module
  try{
    if(scope==='test' && key){ SYNC.queuePush('atr_test_logs', key, state.testLogs[key]); }
    else if(scope==='settings'){ SYNC.queuePush('atr_settings', 'main', {ankleMode: state.ankleMode, _updatedAt: state._settingsUpdatedAt}); }
    else if(key){ SYNC.queuePush('atr_day_logs', key, state.dayLogs[key]); }
    else { SYNC.queuePushAll(); } // bulk change (e.g. restore-from-backup) with no single key
  }catch(e){}
  render();
}
async function loadAll(){
  try{
    const dl = await STORE.get('training-log');
    if(dl) state.dayLogs = JSON.parse(dl);
  }catch(e){}
  try{
    const tl = await STORE.get('test-log');
    if(tl) state.testLogs = JSON.parse(tl);
  }catch(e){}
  try{
    const st = await STORE.get('settings');
    if(st){ const o = JSON.parse(st); state.ankleMode = !!o.ankleMode; }
  }catch(e){}
  try{
    const cfg = await STORE.get('supa-config');
    if(cfg){ const o = JSON.parse(cfg); state.supaUrl = o.url||''; state.supaKey = o.key||''; }
  }catch(e){}
  state.loaded = true;
  if(state.supaUrl && state.supaKey){
    SYNC.init(state.supaUrl, state.supaKey);
    await SYNC.pullAndMerge();
  }
}

/* ================= SYNC (Supabase cross-device sync, offline-first) =================
   Design: every write happens to localStorage / window.storage immediately
   (see STORE + persistAll above), so the app is fully usable offline. On top
   of that, each changed date-entry (one day's log, or one test date) is
   queued and pushed to Supabase individually — never the whole table at
   once — so that a phone and a laptop editing different days at the same
   time merge cleanly instead of one overwriting the other. Conflicts are
   resolved per-entry by comparing the "_updatedAt" timestamp stored inside
   that entry's own JSON: newer wins. The pending queue itself lives in
   localStorage under 'atr_sync_queue' so it survives a refresh or the app
   being closed mid-sync while offline. */
const SYNC = {
  client: null,
  queue: [],       // [{table, date_key, data, updated_at}]
  flushing: false,

  init(url, key){
    try{
      if(!url || !key || typeof window.supabase === 'undefined') { state.supaConnected=false; return false; }
      this.client = window.supabase.createClient(url, key);
      state.supaConnected = true;
      this.loadQueue();
      this.flushQueue();
      return true;
    }catch(e){ state.supaConnected = false; return false; }
  },

  loadQueue(){
    try{ var raw = localStorage.getItem('atr_sync_queue'); this.queue = raw ? JSON.parse(raw) : []; }
    catch(e){ this.queue = []; }
  },
  saveQueue(){
    try{ localStorage.setItem('atr_sync_queue', JSON.stringify(this.queue)); }catch(e){}
  },

  queuePush(table, dateKey, dataObj){
    if(!dataObj) return;
    if(!dataObj._updatedAt) dataObj._updatedAt = new Date().toISOString();
    // replace any existing queued write for the same row — only the latest
    // local version needs to reach the server, not every intermediate edit
    this.queue = this.queue.filter(function(q){ return !(q.table===table && q.date_key===dateKey); });
    this.queue.push({table:table, date_key:dateKey, data:dataObj, updated_at:dataObj._updatedAt});
    this.saveQueue();
    state.syncStatus = state.supaConnected ? 'pending' : 'off';
    this.flushQueue();
  },
  queuePushAll(){
    var self = this;
    Object.keys(state.dayLogs).forEach(function(k){ self.queuePush('atr_day_logs', k, state.dayLogs[k]); });
    Object.keys(state.testLogs).forEach(function(k){ self.queuePush('atr_test_logs', k, state.testLogs[k]); });
  },

  async flushQueue(){
    if(this.flushing) return;
    if(!state.supaConnected || !this.client) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return;
    this.flushing = true;
    try{
      while(this.queue.length){
        var item = this.queue[0];
        try{
          var res = await this.client.from(item.table).upsert({
            date_key: item.date_key, data: item.data, updated_at: item.updated_at
          }, {onConflict:'date_key'});
          if(res.error) throw res.error;
          this.queue.shift();
          this.saveQueue();
          state.syncStatus = 'ok'; state.syncMsg = '已同步';
        }catch(e){
          state.syncStatus = 'err'; state.syncMsg = '同步失敗，會在下次連線時重試：'+(e && e.message ? e.message : '未知錯誤');
          break; // stop draining; keep remaining items queued for retry
        }
      }
      if(this.queue.length===0 && state.syncStatus!=='err'){ state.syncStatus='ok'; }
    } finally {
      this.flushing = false;
      render();
    }
  },

  /* pull every remote row and merge into local state. per-entry: remote
     wins only if its _updatedAt is strictly newer than local's, AND that
     local entry isn't itself still sitting unsent in the queue (an unsent
     local edit must never be silently discarded by an older remote read). */
  async pullAndMerge(){
    if(!state.supaConnected || !this.client) return;
    var self = this;
    try{
      var dayRes = await this.client.from('atr_day_logs').select('date_key,data,updated_at');
      if(!dayRes.error && dayRes.data){
        dayRes.data.forEach(function(row){
          if(self.queuedFor('atr_day_logs', row.date_key)) return; // unsent local edit wins
          var local = state.dayLogs[row.date_key];
          var remoteTs = row.updated_at ? new Date(row.updated_at).getTime() : 0;
          var localTs = (local && local._updatedAt) ? new Date(local._updatedAt).getTime() : 0;
          if(!local || remoteTs > localTs){ state.dayLogs[row.date_key] = row.data; }
        });
      }
      var testRes = await this.client.from('atr_test_logs').select('date_key,data,updated_at');
      if(!testRes.error && testRes.data){
        testRes.data.forEach(function(row){
          if(self.queuedFor('atr_test_logs', row.date_key)) return;
          var local = state.testLogs[row.date_key];
          var remoteTs = row.updated_at ? new Date(row.updated_at).getTime() : 0;
          var localTs = (local && local._updatedAt) ? new Date(local._updatedAt).getTime() : 0;
          if(!local || remoteTs > localTs){ state.testLogs[row.date_key] = row.data; }
        });
      }
      var setRes = await this.client.from('atr_settings').select('data,updated_at').eq('date_key','main').maybeSingle();
      if(!setRes.error && setRes.data){
        var remoteTs2 = setRes.data.updated_at ? new Date(setRes.data.updated_at).getTime() : 0;
        var localTs2 = state._settingsUpdatedAt ? new Date(state._settingsUpdatedAt).getTime() : 0;
        if(remoteTs2 > localTs2 && setRes.data.data){ state.ankleMode = !!setRes.data.data.ankleMode; }
      }
      try{ await STORE.set('training-log', JSON.stringify(state.dayLogs)); }catch(e){}
      try{ await STORE.set('test-log', JSON.stringify(state.testLogs)); }catch(e){}
      state.syncMsg = '已從雲端同步最新資料';
      render();
    }catch(e){ /* pull failure is silent — local data still fully usable */ }
  },
  queuedFor(table, dateKey){
    return this.queue.some(function(q){ return q.table===table && q.date_key===dateKey; });
  }
};

if(typeof window !== 'undefined'){
  window.addEventListener('online', function(){ SYNC.flushQueue(); });
}

/* ---- manual backup / restore (JSON) ----
   window.storage keeps data safe while this file is opened inside Claude;
   localStorage keeps it safe on one browser/device if hosted elsewhere
   (e.g. GitHub Pages). Neither syncs between devices. This export/import
   is the portable, host-agnostic path: copy the text out, paste it back in
   anywhere — Claude, GitHub Pages, a new phone, etc. */
function buildBackupJSON(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    version: 2,
    dayLogs: state.dayLogs,
    testLogs: state.testLogs,
    settings: {ankleMode: state.ankleMode}
  }, null, 0);
}
function downloadBackupFile(){
  try{
    var blob = new Blob([buildBackupJSON()], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'asymmetry-training-backup-'+todayKey()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}
async function copyBackupToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      var ta = document.getElementById('backup-ta');
      if(ta){ ta.focus(); ta.select(); document.execCommand('copy'); return true; }
    }catch(e2){}
    return false;
  }
}
function restoreFromBackupText(text){
  try{
    var o = JSON.parse(text);
    if(!o || typeof o !== 'object') throw new Error('bad shape');
    if(o.dayLogs) state.dayLogs = Object.assign({}, state.dayLogs, o.dayLogs);
    if(o.testLogs) state.testLogs = Object.assign({}, state.testLogs, o.testLogs);
    if(o.settings && typeof o.settings.ankleMode==='boolean') state.ankleMode = o.settings.ankleMode;
    scheduleSave(); // bulk restore, no single date-key — pushes every entry
    return true;
  }catch(e){ return false; }
}

/* ================= phase gates ================= */
function phase2Unlocked(){
  var keys = Object.keys(state.testLogs).length ? Object.keys(state.testLogs) : TESTS_SEED.map(function(t){return t['測試日期'];});
  var filled = keys.map(function(k){ return getTestLog(k); }).filter(function(t){ return t['靠牆滑行 左肋外翻']; });
  filled.sort(function(a,b){ return a['測試日期'] < b['測試日期'] ? -1 : 1; });
  if(!filled.length) return false;
  var latest = filled[filled.length-1];
  return latest['靠牆滑行 左肋外翻'] === '否';
}
function phase3Ready(){
  var keys = TESTS_SEED.map(function(t){return t['測試日期'];});
  var filled = keys.map(function(k){ return getTestLog(k); }).filter(function(t){ return t['左手划船8RM kg'] && t['右手划船8RM kg']; });
  filled.sort(function(a,b){ return a['測試日期'] < b['測試日期'] ? -1 : 1; });
  if(filled.length < 2) return false;
  var last2 = filled.slice(-2);
  return last2.every(function(t){
    var l = parseFloat(t['左手划船8RM kg']), r = parseFloat(t['右手划船8RM kg']);
    var diff = r ? Math.abs(r-l)/r*100 : 100;
    var noNumb = t['EAST 有無麻'] === '無' || t['EAST 有無麻'] === '否';
    return diff < 10 && noNumb;
  });
}

/* ================= chart builders (hand-rolled SVG, no dependency) ================= */
function lineChartSvg(seriesList, opts){
  opts = opts || {};
  var W = opts.width||320, H = opts.height||140, P = {l:24,r:10,t:12,b:20};
  var n = 0;
  seriesList.forEach(function(s){ if(s.points.length>n) n = s.points.length; });
  if(n===0) return '';
  var allY = [];
  seriesList.forEach(function(s){ s.points.forEach(function(p){ if(p.y!==null && p.y!==undefined) allY.push(p.y); }); });
  if(!allY.length) return '';
  var yMin = opts.yMin!==undefined ? opts.yMin : Math.min.apply(null,allY);
  var yMax = opts.yMax!==undefined ? opts.yMax : Math.max.apply(null,allY);
  if(opts.yMin===undefined) yMin = Math.min(yMin,0);
  if(yMax===yMin) yMax = yMin+1;
  function xPos(i){ return P.l + (n<=1?((W-P.l-P.r)/2):(i/(n-1))*(W-P.l-P.r)); }
  function yPos(v){ return P.t + (1-(v-yMin)/(yMax-yMin))*(H-P.t-P.b); }
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">';
  for(var g=0; g<=2; g++){
    var gy = P.t + g*(H-P.t-P.b)/2;
    svg += '<line x1="'+P.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  }
  if(opts.thresholdY!==undefined && opts.thresholdY!==null){
    var ty = yPos(opts.thresholdY);
    svg += '<line x1="'+P.l+'" y1="'+ty.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+ty.toFixed(1)+'" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3,3" opacity=".6"/>';
  }
  seriesList.forEach(function(s){
    var segPts = [];
    s.points.forEach(function(p,i){
      if(p.y===null||p.y===undefined) return;
      segPts.push(xPos(i).toFixed(1)+','+yPos(p.y).toFixed(1));
    });
    if(segPts.length>1){
      svg += '<polyline points="'+segPts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    s.points.forEach(function(p,i){
      if(p.y===null||p.y===undefined) return;
      svg += '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.y).toFixed(1)+'" r="3.2" fill="'+s.color+'"/>';
    });
  });
  if(opts.xLabels){
    opts.xLabels.forEach(function(lab,i){
      if(!lab) return;
      var anchor = (i===0) ? 'start' : (i===opts.xLabels.length-1 ? 'end' : 'middle');
      svg += '<text x="'+xPos(i).toFixed(1)+'" y="'+(H-4)+'" font-size="9.5" fill="var(--ink-faint)" text-anchor="'+anchor+'" font-family="Space Grotesk, sans-serif">'+escHtml(lab)+'</text>';
    });
  }
  svg += '</svg>';
  return svg;
}

        (swapped ? '<div class="dswap">原計畫 '+escHtml(DAY_TYPE_INFO[sc.dayType]?DAY_TYPE_INFO[sc.dayType].short:sc.dayType)+'</div>' : (w.note?'<div class="dnote">'+escHtml(w.note)+'</div>':'')));

      parts.push('</div>');

/* ================= STATS tab ================= */
function computeStreaks(){
  var keys = SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); });
  var longest=0, run=0;
  keys.forEach(function(k){
    var w=getDayLog(k);
    if(w.dayDone){ run++; if(run>longest) longest=run; } else { run=0; }
  });
  var cs=0;
  for(var i=keys.length-1;i>=0;i--){
    var w=getDayLog(keys[i]);
    if(w.dayDone) cs++; else break;
  }
  return {current:cs, longest:longest};
}
function computeAdherence(){
  var keys = SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); });
  var done = keys.filter(function(k){ return getDayLog(k).dayDone; }).length;
  return {done:done, total:keys.length, pct: keys.length? Math.round(done/keys.length*100):0};
}
function computeByDayType(){
  var agg = {};
  DAY_TYPES.concat(['測試日']).forEach(function(t){ agg[t]={done:0,total:0}; });
  SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); }).forEach(function(k){
    var sc=SCHEDULE[k]; var w=getDayLog(k);
    var t = w.dayType || sc.dayType;
    if(!agg[t]) agg[t]={done:0,total:0};
    agg[t].total++;
    if(w.dayDone) agg[t].done++;
  });
  return agg;
}
function computeWeeklyAdherence(){
  var byWeek = groupByWeek();
  var weekNums = Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});
  var tKey = todayKey();
  var out = [];
  weekNums.forEach(function(wn){
    var keys = byWeek[wn].filter(function(k){ return k<=tKey; });
    if(!keys.length) return;
    var done = keys.filter(function(k){ return getDayLog(k).dayDone; }).length;
    out.push({week:wn, done:done, total:keys.length});
  });
  return out;
}
function computeBballLoad(){
  var games=0, minutes=0;
  SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); }).forEach(function(k){
    var w = getDayLog(k);
    var m = numOrNull(w.gameMinutes);
    if(m!==null && m>0){ games++; minutes+=m; }
  });
  return {games:games, minutes:minutes};
}
function computeAnkleFlagDays(){
  var out = [];
  SCHEDULE_KEYS.forEach(function(k){
    var w = state.dayLogs[k];
    if(!w || !w.flags) return;
    if(w.flags.swell||w.flags.limp||w.flags.giveway||w.flags.over10d) out.push(k);
  });
  return out;
}
function symptomSeries(code){
  var meta = SYMPTOM_META[code];
  if(!meta || !meta.logField) return [];
  var pts=[];
  SCHEDULE_KEYS.forEach(function(k){
    var w = getDayLog(k);
    var v = numOrNull(w[meta.logField]);
    if(v!==null) pts.push({k:k, v:v});
  });
  return pts;
}
function symptomLatest(code){
  if(code==='B'){
    var keys = TEST_DATE_KEYS.filter(function(k){ return getTestLog(k)['EAST 有無麻']; });
    if(!keys.length) return {display:'—', dateLabel:'尚無紀錄', trend:null, status:symKmStatus('B')};
    var lk = keys[keys.length-1];
    var numb = getTestLog(lk)['EAST 有無麻'];
    var neg = (numb==='無'||numb==='否');
    return {display: neg?'無麻':'有麻', dateLabel:fmtMD(keyToDate(lk)), trend:null, status:symKmStatus('B')};
  }
  var pts = symptomSeries(code);
  if(!pts.length) return {display:'—', dateLabel:'尚無紀錄', trend:null, status:symKmStatus(code)};
  var last = pts[pts.length-1];
  var prev = pts.length>1 ? pts[pts.length-2] : null;
  return {display:String(last.v), dateLabel:fmtMD(keyToDate(last.k)), trend: prev!==null?(last.v-prev.v):null, status:symKmStatus(code)};
}
function symptomCardHtml(code){
  var meta = SYMPTOM_META[code];
  var latest = symptomLatest(code);
  var status = latest.status;
  var statusCls = symStatusClass(status);
  var trendHtml = '';
  if(latest.trend!==null && latest.trend!==undefined){
    if(latest.trend<0) trendHtml = '<span class="trend arrow-ok">▼'+Math.abs(latest.trend)+'</span>';
    else if(latest.trend>0) trendHtml = '<span class="trend arrow-bad">▲'+latest.trend+'</span>';
    else trendHtml = '<span class="trend muted">–0</span>';
  }
  var isNum = latest.display!=='有麻' && latest.display!=='無麻';
  return '<div class="sym-card" data-action="gotoKnowledgeSym" data-code="'+escHtml(code)+'">'+
    '<div class="sc-top"><span class="sc-code">'+escHtml(code)+'</span>'+(status?'<span class="sc-status '+statusCls+'">'+escHtml(status)+'</span>':'')+'</div>'+
    '<div class="sc-name">'+escHtml(meta.name)+'</div>'+
    '<div class="sc-score"><span class="num" style="color:'+meta.color+'">'+escHtml(latest.display)+'</span>'+(isNum&&latest.display!=='—'?'<span class="unit">/10</span>':'')+trendHtml+'</div>'+
    '<div class="sc-date">'+escHtml(latest.dateLabel)+'</div>'+
  '</div>';
}
const HEX = {left:'#8fcbdc', right:'#e8c37f', ok:'#6ba077', danger:'#d1594c', know:'#a98ee8', dim:'#9aa1aa'};
const DAYTYPE_HEX = {'上肢A':'#e8c37f','上肢B':'#e8c37f','下肢':'#e0a074','輕鬆日':'#8fc79e','打波':'#e8916f','休息':'#9aa1aa','測試日':'#c19bea'};

function buildSymptomChartSeries(codes){
  var dateSet = {};
  codes.forEach(function(c){ symptomSeries(c).forEach(function(p){ dateSet[p.k]=true; }); });
  var dates = Object.keys(dateSet).sort();
  var series = codes.map(function(c){
    var meta = SYMPTOM_META[c];
    var byDate = {};
    symptomSeries(c).forEach(function(p){ byDate[p.k]=p.v; });
    return { label: meta.name, color: meta.color, points: dates.map(function(dk){ return {y: byDate[dk]!==undefined?byDate[dk]:null}; }) };
  });
  return {series:series, dates:dates};
}
function sparseXLabels(dates){
  var xLabels = dates.map(function(){ return ''; });
  if(xLabels.length){ xLabels[0]=fmtMD(keyToDate(dates[0])); if(xLabels.length>1) xLabels[xLabels.length-1]=fmtMD(keyToDate(dates[dates.length-1])); }
  return xLabels;
}
function buildRowChart(){
  var dates = TEST_DATE_KEYS;
  var leftPts = dates.map(function(dk){ return {y:numOrNull(getTestLog(dk)['左手划船8RM kg'])}; });
  var rightPts = dates.map(function(dk){ return {y:numOrNull(getTestLog(dk)['右手划船8RM kg'])}; });
  return {series:[{label:'左手 8RM',color:HEX.left,points:leftPts},{label:'右手 8RM',color:HEX.right,points:rightPts}], dates:dates};
}
function buildDiffChart(){
  var dates = TEST_DATE_KEYS;
  var pts = dates.map(function(dk){
    var t = getTestLog(dk);
    var l = numOrNull(t['左手划船8RM kg']), r = numOrNull(t['右手划船8RM kg']);
    var v = (l!==null && r!==null && r!==0) ? Math.round(Math.abs(r-l)/r*100) : null;
    return {y:v};
  });
  return {series:[{label:'左右差 %',color:HEX.danger,points:pts}], dates:dates};
}

/* ================= TESTS tab ================= */
function testIsFilled(t){
  return !!(t['左手划船8RM kg'] && t['右手划船8RM kg']);
}
function computeDiffPct(t){
  var l = parseFloat(t['左手划船8RM kg']), r = parseFloat(t['右手划船8RM kg']);
  if(!l || !r) return null;
  return Math.round(Math.abs(r-l)/r*100);
}
function computeStageStatus(k){
  var idx = TEST_DATE_KEYS.indexOf(k);
  if(idx===-1) return {label:'額外測試（非排定的 4 週週期）', cls:''};
  if(idx===0) return {label:'基準測試', cls:''};
  var t = getTestLog(k);
  if(k === TEST_DATE_KEYS[1]){
    if(!t['靠牆滑行 左肋外翻']) return {label:'待填寫', cls:''};
    return t['靠牆滑行 左肋外翻']==='否' ? {label:'✓ 達標，可進 Phase 2', cls:'ok'} : {label:'尚未達標，續留 Phase 1', cls:'bad'};
  }
  if(k === TEST_DATE_KEYS[2] || k === TEST_DATE_KEYS[3]){
    if(!testIsFilled(t)) return {label:'待填寫', cls:''};
    return phase3Ready() ? {label:'✓ 連續兩次達標，可進 Phase 3', cls:'ok'} : {label:'尚未連續達標', cls:'bad'};
  }
  return {label:'', cls:''};
}

  parts.push('<div class="field"><label>左肋有沒有外翻</label>'+segHtml('test',k,'靠牆滑行 左肋外翻',[['是','是（外翻）'],['否','否']],t['靠牆滑行 左肋外翻'])+'</div>');
