  parts.push(textFieldHtml('test',k,'EAST 左後肩酸出現秒數','左後肩開始酸的秒數',t['EAST 左後肩酸出現秒數'],{type:'number',placeholder:'例如 90'}));
  parts.push('<div class="field"><label>有沒有麻／電／沉重／手變白</label>'+segHtml('test',k,'EAST 有無麻',[['有','有'],['無','無']],t['EAST 有無麻'])+'</div>');

  parts.push('<div class="section-title">內收肌落下 + 震盪判別</div>');
  parts.push('<div class="row" style="gap:10px">');
  parts.push('<div style="flex:1">'+textFieldHtml('test',k,'內收肌落下 左 拳','左（拳頭數）',t['內收肌落下 左 拳'],{type:'number',step:'0.5'})+'</div>');
  parts.push('<div style="flex:1">'+textFieldHtml('test',k,'內收肌落下 右 拳','右（拳頭數）',t['內收肌落下 右 拳'],{type:'number',step:'0.5'})+'</div>');
  parts.push('</div>');
  parts.push('<div class="field"><label>震盪後有無改善</label>'+segHtml('test',k,'內收肌 震盪後有改善',[['有改善','有改善（軟組織）'],['無變化','無變化（關節囊／骨性）']],t['內收肌 震盪後有改善'])+'</div>');

  parts.push('<div class="section-title">過頂階梯</div>');
  parts.push('<div class="field">'+segHtml('test',k,'過頂階梯 第幾階',[['1','第1階'],['2','第2階'],['3','第3階'],['4','第4階']],t['過頂階梯 第幾階'])+'</div>');

  parts.push('<div class="section-title">六項症狀評分 0–10</div>');
  [['A 肩胛翼狀','A 肩胛翼狀'],['C 左髕腱','C 左髕腱'],['D 右髖彈響','D 右髖彈響'],['E 左內收肌','E 左內收肌'],['左後肩酸','左後肩酸'],['左腳踝','左腳踝']].forEach(function(pair){
    parts.push('<div class="field"><label>'+pair[1]+'</label>'+scorebandHtml('test',k,pair[0],t[pair[0]])+'</div>');
  });

  var stat = computeStageStatus(k);
  if(stat.label){
    parts.push('<div class="banner '+(stat.cls==='ok'?'done':(stat.cls==='bad'?'warn':'deload'))+'">'+(stat.cls==='ok'?'✓ ':'▸ ')+stat.label+'</div>');
  }

  parts.push(textFieldHtml('test',k,'備註','備註',t['備註'],{type:'textarea'}));
  parts.push('<button class="btn ghost block" data-action="closeTest">收合</button>');
  parts.push('</div>');
  return parts.join('');
}

function allTestKeys(){
  var extra = Object.keys(state.testLogs).filter(function(k){
    if(TEST_DATE_KEYS.indexOf(k)!==-1) return false;
    var t = state.testLogs[k];
    return t && Object.keys(t).some(function(f){ return t[f]!==undefined && t[f]!==null && t[f]!==''; });
  });
  return TEST_DATE_KEYS.concat(extra).sort();
}

function renderTests(){
  var parts = [];
  var keys = allTestKeys();

  var filledTests = keys.map(function(k){return getTestLog(k);}).filter(testIsFilled);
  if(filledTests.length >= 2){
    parts.push('<div class="section-title" style="margin-top:0">趨勢</div>');
    parts.push('<div class="card">');
    var rows = [
      ['左划船8RM','左手划船8RM kg','kg'], ['右划船8RM','右手划船8RM kg','kg'],
      ['左右差%','__diff__','%'], ['左後肩酸秒數','EAST 左後肩酸出現秒數','s']
    ];
    rows.forEach(function(r){
      var vals = keys.map(function(k){
        var t = getTestLog(k);
        if(!testIsFilled(t) && r[1]!=='EAST 左後肩酸出現秒數') { if(!t[r[1]] && r[1]!=='__diff__') return null; }
        var v = r[1]==='__diff__' ? computeDiffPct(t) : t[r[1]];
        return (v===undefined||v==='') ? null : v;
      });
      if(vals.every(function(v){return v===null;})) return;
      parts.push('<div class="trend-row"><span class="tlabel">'+r[0]+'</span><span class="tvals">'+
        vals.map(function(v,i){
          if(v===null) return '';
          var sc = SCHEDULE[keys[i]];
          var wl = sc ? ('W'+sc.weekNum) : fmtMD(keyToDate(keys[i]));
          return '<span class="tv">'+wl+' · '+v+r[2]+'</span>';
        }).join('')+
      '</span></div>');
    });
    parts.push('</div>');
  }

  parts.push('<div class="section-title" style="margin-top:0">測試記錄</div>');
  if(keys.indexOf(todayKey())===-1){
    parts.push('<button type="button" class="btn ghost block" data-action="openTest" data-key="'+todayKey()+'" style="margin-bottom:12px">+ 新增今天的額外測試</button>');
  }
  keys.forEach(function(k){
    var t = getTestLog(k);
    var filled = testIsFilled(t);
    var isOpen = (state.testOpen === k);
    var d = keyToDate(k);
    var sc = SCHEDULE[k];
    parts.push('<div class="card" style="padding:14px 16px;'+(isOpen?'border-color:var(--right)':'')+'">');
    parts.push('<div class="row" data-action="'+(isOpen?'closeTest':'openTest')+'" data-key="'+k+'" style="cursor:pointer">');
    parts.push('<div><div class="disp" style="font-weight:700">'+fmtYMD(d)+(sc?(' · W'+sc.weekNum):'')+'</div><div class="tiny muted">'+escHtml(sc?sc.phase:'額外測試')+'</div></div>');
    if(filled){
      var diff = computeDiffPct(t);
      parts.push('<span class="pill" style="background:var(--ok-bg);color:var(--ok)">左'+t['左手划船8RM kg']+'／右'+t['右手划船8RM kg']+'kg'+(diff!==null?'（差'+diff+'%）':'')+'</span>');
    } else {
      parts.push('<span class="pill" style="background:var(--surface-2);color:var(--ink-dim)">'+(k===todayKey()?'今天':(k<todayKey()?'待補':'尚未到'))+' · 填寫</span>');
    }
    parts.push('</div>');
    if(isOpen){ parts.push(testFormHtml(k)); }
    parts.push('</div>');
  });

  return parts.join('');
}

/* ================= top-level render + topbar ================= */
const TAB_META = {
  today:    {eyebrow:'ASYMMETRY PROTOCOL', title:'今日訓練'},
  calendar: {eyebrow:'12-WEEK PLAN', title:'訓練日曆'},
  stats:    {eyebrow:'YOUR NUMBERS', title:'統計數據'},
  library:  {eyebrow:'REFERENCE', title:'動作庫'},
  knowledge:{eyebrow:'THE WHY', title:'知識手冊'},
  tests:    {eyebrow:'EVERY 4 WEEKS', title:'測試記錄'}
};
var _lastPillSig = null; // tracks which day-type pill we last auto-scrolled to, so render() only nudges the horizontal picker when the selection actually changed instead of on every button press
function render(){
  var view = document.getElementById('view');
  var html;
  if(state.tab==='today') html = renderToday();
  else if(state.tab==='calendar') html = renderCalendar();
  else if(state.tab==='stats') html = renderStats();
  else if(state.tab==='library') html = renderLibrary();
  else if(state.tab==='knowledge') html = renderKnowledge();
  else html = renderTests();
  view.innerHTML = '<div class="screen">'+html+'</div>';

  // Particle Human (Step 1 prototype): re-attach/resize into the fresh DOM node.
  // mount() is idempotent — it only creates the WebGL scene once, ever.
  if(state.tab==='today'){
    var phSlot = document.getElementById('particle-human-slot');
    if(phSlot && window.ParticleHuman){ window.ParticleHuman.mount(phSlot); }
  }

  var meta = TAB_META[state.tab];
  document.getElementById('tb-eyebrow').textContent = meta.eyebrow;
  document.getElementById('tb-title').textContent = meta.title;
  var sub = '';
  if(state.tab==='today'){
    var sc = SCHEDULE[todayKey()];
    sub = sc ? ('今天 · '+DOW_ZH[todayDate().getDay()]+'　W'+sc.weekNum+' · '+sc.phase) : '';
  } else if(state.tab==='calendar'){
    sub = PLAN_START_KEY+' ～ '+PLAN_END_KEY;
  } else if(state.tab==='stats'){
    sub = '完成率、症狀趨勢、左右力量差';
  } else if(state.tab==='library'){
    sub = EXERCISES.length+' 個動作';
  } else if(state.tab==='knowledge'){
    sub = KNOWLEDGE.length+' 則知識卡 · 課表卡的「為什麼」';
  } else if(state.tab==='tests'){
    sub = 'W1 · W4 · W8 · W12';
  }
  document.getElementById('tb-sub').textContent = sub;

  document.querySelectorAll('#tabbar button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });

  if(state.tab==='today'){
    var selPill = document.querySelector('.daytype-pill.sel');
    var pillSig = state.focusDate+'|'+(selPill?selPill.dataset.value:'');
    if(selPill && pillSig !== _lastPillSig){
      var picker = selPill.closest('.daytype-picker');
      if(picker){
        var pr = selPill.getBoundingClientRect(), cr = picker.getBoundingClientRect();
        if(pr.left < cr.left) picker.scrollLeft -= (cr.left - pr.left) + 10;
        else if(pr.right > cr.right) picker.scrollLeft += (pr.right - cr.right) + 10;
      }
    }
    _lastPillSig = pillSig;
  } else {
    _lastPillSig = null;
  }
}

function setNested(obj, path, value){
  var parts = path.split('.');
  var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}
function getNested(obj, path){
  var parts = path.split('.');
  var o = obj;
  for(var i=0;i<parts.length;i++){ o = o[parts[i]]; if(o===undefined) return undefined; }
  return o;
}
function scopeObj(scope, key){
  return scope==='test' ? getTestLog(key) : getDayLog(key);
}

/* ================= event delegation ================= */
document.getElementById('view').addEventListener('click', async function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;

  if(action==='prevDay'){ state.focusDate = dateKey(addDays(keyToDate(state.focusDate),-1)); render(); return; }
  if(action==='nextDay'){ state.focusDate = dateKey(addDays(keyToDate(state.focusDate),1)); render(); return; }
  if(action==='jumpToday'){ state.focusDate = todayKey(); render(); return; }
  if(action==='gotoDay'){ state.focusDate = t.dataset.key; state.tab='today'; render(); window.scrollTo(0,0); return; }
  if(action==='gotoTest'){ state.tab='tests'; state.testOpen = t.dataset.key; render(); window.scrollTo(0,0); return; }
  if(action==='openTest'){ state.testOpen = t.dataset.key; render(); return; }
  if(action==='closeTest'){ state.testOpen = null; render(); return; }
  if(action==='toggleAnkle'){ state.ankleMode = !state.ankleMode; scheduleSave('settings'); render(); return; }
  if(action==='toggleExOpen'){ var ok=t.dataset.exkey; state.openEx[ok] = !state.openEx[ok]; render(); return; }
  if(action==='toggleLibOpen'){ var lk=t.dataset.libkey; state.libOpen[lk] = !state.libOpen[lk]; render(); return; }
  if(action==='toggleExDone'){
    var w = getDayLog(t.dataset.key);
    var ek = t.dataset.exkey;
    w.exDone[ek] = !w.exDone[ek];
    scheduleSave('day', t.dataset.key); render(); return;
  }
  if(action==='toggleDayDone'){
    var w2 = getDayLog(t.dataset.key);
    w2.dayDone = !w2.dayDone;
    scheduleSave('day', t.dataset.key); render(); return;
  }
  if(action==='completeAll'){
    var k4 = t.dataset.key;
    var w4 = getDayLog(k4);
    var dt4 = w4.dayType;
    var list4 = EX_BY_DAYTYPE[dt4] || [];
    list4.forEach(function(e){ w4.exDone[exKey(e['課表日'],e['順序'])] = true; });
    w4.dayDone = true;
    state.celebrate = k4;
    scheduleSave('day', k4); render();
    setTimeout(function(){ if(state.celebrate===k4){ state.celebrate=null; render(); } }, 900);
    return;
  }
  if(action==='setDayType'){
    var k5=t.dataset.key, v5=t.dataset.value;
    getDayLog(k5).dayType = v5;
    scheduleSave('day', k5); render(); return;
  }
  if(action==='resetDayType'){
    var k6=t.dataset.key;
    var w6=getDayLog(k6);
    var sc6=SCHEDULE[k6];
    w6.dayType = sc6 ? sc6.dayType : w6.dayType;
    scheduleSave('day', k6); render(); return;
  }
  if(action==='toggleBool'){
    var obj = scopeObj(t.dataset.scope, t.dataset.key);
    setNested(obj, t.dataset.field, !getNested(obj, t.dataset.field));
    scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key); render(); return;
  }
  if(action==='setSeg'){
    var obj2 = scopeObj(t.dataset.scope, t.dataset.key);
    var cur = getNested(obj2, t.dataset.field);
    var val = t.dataset.value;
    setNested(obj2, t.dataset.field, (String(cur)===String(val)) ? '' : val);
    scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key); render(); return;
  }
  if(action==='setLibFilter'){ state.libFilter = t.dataset.value; render(); return; }
  if(action==='setKmFilter'){ state.kmFilter = t.dataset.value; state.kmSymFilter=null; render(); return; }
  if(action==='gotoKnowledgeSym'){ state.tab='knowledge'; state.kmSymFilter=t.dataset.code; state.kmFilter='全部'; state.kmSearch=''; render(); window.scrollTo(0,0); return; }
  if(action==='clearKmSymFilter'){ state.kmSymFilter=null; render(); return; }
  if(action==='toggleStatSym'){ var c7=t.dataset.code; state.statsSymOn[c7] = (state.statsSymOn[c7]===false)?true:false; render(); return; }
  if(action==='doExport'){ state.backupText = buildBackupJSON(); state.backupMsg='已產生備份文字，記得複製走或下載。'; render(); return; }
  if(action==='doDownload'){ var okd=downloadBackupFile(); state.backupMsg = okd? '已觸發下載。' : '這個環境不支援直接下載，改用「匯出備份」+「複製到剪貼簿」。'; render(); return; }
  if(action==='doCopy'){
    var text9 = state.backupText || buildBackupJSON();
    state.backupText = text9;
    var ok9 = await copyBackupToClipboard(text9);
    state.backupMsg = ok9 ? '已複製到剪貼簿。' : '複製失敗，請手動選取文字框內容複製。';
    render(); return;
  }
  if(action==='doImport'){
    var ok10 = restoreFromBackupText(state.backupText);
    state.backupMsg = ok10 ? '已匯入還原，資料已套用。' : '格式不正確，請確認貼上的是完整備份文字。';
    render(); return;
  }
  if(action==='connectSync'){
    var url = (state.syncFormUrl||'').trim();
    var key = (state.syncFormKey||'').trim();
    if(!url || !key){ state.syncMsg = '請把 Project URL 和 anon key 都貼上。'; render(); return; }
    var ok11 = SYNC.init(url, key);
    if(ok11){
      state.supaUrl = url; state.supaKey = key; state.syncMsg = '';
      try{ await STORE.set('supa-config', JSON.stringify({url:url, key:key})); }catch(e){}
      await SYNC.pullAndMerge();
      SYNC.queuePushAll(); // make sure anything only-local gets pushed up too
    } else {
      state.syncMsg = '連線失敗，請確認網址與金鑰是否正確，以及是否已用 SYNC_SETUP.md 建好三張表。';
    }
    render(); return;
  }
  if(action==='disconnectSync'){
    state.supaConnected = false; state.supaUrl=''; state.supaKey=''; SYNC.client=null;
    try{ await STORE.set('supa-config', JSON.stringify({url:'', key:''})); }catch(e){}
    render(); return;
  }
  if(action==='syncNow'){ await SYNC.flushQueue(); await SYNC.pullAndMerge(); render(); return; }
});

document.getElementById('view').addEventListener('input', function(e){
  var t = e.target.closest('[data-action="setText"],[data-action="libSearch"],[data-action="kmSearchInput"],[data-action="backupText"]');
  if(!t) return;
  if(t.dataset.action==='libSearch'){
    state.libSearch = t.value;
    var caret = t.selectionStart;
    render();
    var again = document.querySelector('.searchbox');
    if(again){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(e){} }
    return;
  }
  if(t.dataset.action==='kmSearchInput'){
    state.kmSearch = t.value;
    var caret2 = t.selectionStart;
    render();
    var again2 = document.querySelector('.searchbox');
    if(again2){ again2.focus(); try{ again2.setSelectionRange(caret2, caret2); }catch(e){} }
    return;
  }
  if(t.dataset.action==='backupText'){ state.backupText = t.value; return; }
  var obj = scopeObj(t.dataset.scope, t.dataset.key);
  obj[t.dataset.field] = t.value;
  scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key);
});

document.getElementById('view').addEventListener('input', function(e){
  var t2 = e.target.closest('[data-action="syncFormUrl"],[data-action="syncFormKey"]');
  if(!t2) return;
  if(t2.dataset.action==='syncFormUrl') state.syncFormUrl = t2.value;
  if(t2.dataset.action==='syncFormKey') state.syncFormKey = t2.value;
});

document.getElementById('view').addEventListener('change', function(e){
  var t = e.target.closest('[data-action="setText"]');
  if(!t) return;
  var obj = scopeObj(t.dataset.scope, t.dataset.key);
  obj[t.dataset.field] = t.value;
  scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key);
  render();
});

document.getElementById('tabbar').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if(!b) return;
  state.tab = b.dataset.tab;
  render();
  document.getElementById('view').scrollTop = 0;
  window.scrollTo(0,0);
});

/* ================= init ================= */
async function init(){
  await loadAll();
  render();
}
init();

window.addEventListener('pagehide', function(){
  if(window.ParticleHuman){ window.ParticleHuman.destroy(); }
});
