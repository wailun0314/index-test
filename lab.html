<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Particle Human — 調參實驗室</title>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
</script>
<script type="module" src="./particle-human.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0A0B0D;
    --ink:#ECE9E2; --ink-dim:#8B939C; --ink-faint:#535A62;
    --line:rgba(236,233,226,.10);
    --left:#57A0B5; --right:#D4A04A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Space Grotesk',-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  #stage{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 90% at 16% 10%, rgba(87,160,181,.055), transparent 55%),
      radial-gradient(110% 85% at 88% 90%, rgba(212,160,74,.042), transparent 52%),
      radial-gradient(70% 55% at 56% 48%, rgba(220,233,236,.022), transparent 60%),
      var(--bg);
  }
  #stage.plain{background:var(--bg);}
  #particle-human-slot{position:absolute; inset:0;}

  /* horizon line — gives the figure a ground to stand on */
  #horizon{
    position:absolute; left:8%; right:8%; bottom:14%; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(236,233,226,.11) 30%, rgba(236,233,226,.11) 70%, transparent);
    opacity:.7;
  }

  /* ---------- editorial type overlay ---------- */
  #type{position:absolute; left:clamp(24px,5vw,72px); top:50%; transform:translateY(-50%); pointer-events:none; max-width:min(38vw,420px);}
  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:18px;}
  .display{font-size:clamp(34px,5.4vw,64px); font-weight:300; line-height:1.02; letter-spacing:-.02em; margin:0;}
  .display em{font-style:normal; color:var(--ink-faint);}
  .meta{margin-top:26px; display:flex; gap:26px;}
  .meta div{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint);}
  .meta b{display:block; font-size:19px; font-weight:400; letter-spacing:-.01em; margin-top:6px; color:var(--ink);}
  .meta .l b{color:var(--left);} .meta .r b{color:var(--right);}

  /* ---------- panel ---------- */
  #panel{
    position:fixed; right:0; top:0; bottom:0; width:308px; z-index:10;
    background:rgba(12,13,15,.82); backdrop-filter:blur(22px);
    border-left:1px solid var(--line);
    padding:20px 18px 28px; overflow-y:auto;
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  #panel.hidden{transform:translateX(100%);}
  #panel h2{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; margin:0 0 14px;}
  .grp{border-top:1px solid var(--line); padding-top:14px; margin-top:18px;}
  .grp:first-of-type{border-top:none; margin-top:0; padding-top:0;}
  .grp > .lbl{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px;}

  .row{margin-bottom:13px;}
  .row .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .row .name{font-size:12px; color:var(--ink-dim);}
  .row .val{font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink);}
  .row.rb .name::after{content:'·'; color:var(--right); margin-left:5px; font-weight:700;}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:2px; margin:0;
    background:rgba(236,233,226,.16); border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--ink); cursor:pointer; border:none;
  }
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--ink); border:none; cursor:pointer;}
  input[type=range]:focus-visible{outline:2px solid var(--left); outline-offset:4px;}

  .btns{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:16px;}
  button{
    font-family:inherit; font-size:11.5px; letter-spacing:.06em; padding:10px 8px;
    background:rgba(236,233,226,.05); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:8px; cursor:pointer; transition:.16s;
  }
  button:hover{background:rgba(236,233,226,.10); color:var(--ink);}
  button:focus-visible{outline:2px solid var(--left); outline-offset:2px;}
  button.wide{grid-column:1/-1;}
  button.go{background:rgba(87,160,181,.14); border-color:rgba(87,160,181,.34); color:#9FD3E2;}

  #hint{position:fixed; left:18px; bottom:16px; font-size:10.5px; letter-spacing:.1em; color:var(--ink-faint); z-index:11;}
  #note{font-size:10.5px; line-height:1.55; color:var(--ink-faint); margin-top:16px;}
  #note b{color:var(--right); font-weight:400;}

  @media (max-width:860px){
    #panel{width:100%; height:56vh; top:auto; border-left:none; border-top:1px solid var(--line);}
    #panel.hidden{transform:translateY(100%);}
    #type{top:12%; transform:none; max-width:78vw;}
  }
  @media (prefers-reduced-motion:reduce){ #panel{transition:none;} }
</style>
</head>
<body>

<div id="stage">
  <div id="particle-human-slot" aria-hidden="true"></div>
  <div id="horizon"></div>
  <div id="type">
    <div class="eyebrow">Asymmetry Protocol</div>
    <h1 class="display">你的身體<br><em>不是</em>對稱的</h1>
    <div class="meta">
      <div class="l">Left<b id="mL">27.5</b></div>
      <div class="r">Right<b id="mR">30.0</b></div>
      <div>Gap<b id="mG">8.3%</b></div>
    </div>
  </div>
</div>

<aside id="panel" aria-label="調參面板">
  <h2>Particle Human — Tuning</h2>
  <div id="controls"></div>
  <div class="btns">
    <button class="wide go" id="bRebuild">重建粒子（套用 · 標記項）</button>
    <button id="bReplay">重播進場</button>
    <button id="bBg">背景霧 開/關</button>
    <button class="wide" id="bCopy">複製 CONFIG 數值</button>
  </div>
  <div id="note">
    標 <b>·</b> 的項目要按「重建粒子」才生效，其餘即時。<br>
    按 <b>H</b> 收起面板再截圖。
  </div>
</aside>

<div id="hint">H 收起面板　·　滑鼠移到人體附近試互動</div>

<script type="module">
import PH from './particle-human.js';

const C = PH.config;

/* path, label, min, max, step, needsRebuild */
const SPECS = [
  ['__g', '造型 / Form'],
  ['asymmetry.value',            '不對稱強度',   0,    1,    0.01, false],
  ['tint',                       '左右色分離',   0,    1,    0.01, false],
  ['render.depthContrast',       '深度對比',     0,    0.95, 0.01, false],

  ['__g', '光 / Light'],
  ['render.glow',                '光暈強度',     0,    2.5,  0.02, false],
  ['render.haze',                '整體霧量',     0.2,  2.0,  0.02, false],
  ['render.sizeMul',             '粒子大小',     0.4,  2.2,  0.02, false],
  ['particles.brightFraction',   '亮粒子比例',   0.01, 0.30, 0.005, true],
  ['particles.dimFalloff',       '暗粒子壓低',   1.0,  6.0,  0.1,  true],

  ['__g', '密度 / Density'],
  ['particles.countDesktop',     '粒子數（桌機）', 2000, 20000, 500, true],
  ['particles.shellThickness',   '表層厚度',     0.04, 0.32, 0.005, true],
  ['particles.coreSparsity',     '核心稀疏度',   0.02, 0.60, 0.01, true],
  ['particles.atmosphereRatio',  '環境粒子比例', 0,    0.45, 0.01, true],
  ['particles.densityBias',      '右側密度偏移', 0,    0.35, 0.01, true],

  ['__g', '運動 / Motion'],
  ['breathing.amplitude',        '呼吸幅度',     0,    0.20, 0.002, false],
  ['breathing.periodSec',        '呼吸週期 s',   3,    18,   0.5,  false],
  ['rotation.ampA',              '旋轉幅度',     0,    0.45, 0.005, false],
  ['noise.amplitude',            '粒子漂移',     0,    0.02, 0.0005, false],
  ['mouse.radius',               '滑鼠半徑',     0.1,  1.2,  0.01, false],
  ['mouse.strength',             '滑鼠推力',     0,    0.4,  0.005, false],

  ['__g', '構圖 / Framing'],
  ['camera.fov',                 '視角 FOV',     14,   48,   0.5,  false],
  ['camera.distance',            '相機距離',     3.0,  9.0,  0.05, false],
  ['camera.offsetXWide',         '人體右偏',     0,    1.2,  0.01, false],
];

const get = (p) => p.split('.').reduce((o, k) => o[k], C);
const set = (p, v) => {
  const ks = p.split('.');
  const last = ks.pop();
  ks.reduce((o, k) => o[k], C)[last] = v;
};
const fmt = (v) => (Math.abs(v) >= 100 ? String(Math.round(v)) : v.toFixed(v < 0.02 ? 4 : (v < 1 ? 3 : 2)).replace(/0+$/, '').replace(/\.$/, ''));

const host = document.getElementById('controls');
let group = null;

for (const s of SPECS) {
  if (s[0] === '__g') {
    group = document.createElement('div');
    group.className = 'grp';
    group.innerHTML = '<div class="lbl">' + s[1] + '</div>';
    host.appendChild(group);
    continue;
  }
  const [path, label, min, max, step, rb] = s;
  const row = document.createElement('div');
  row.className = 'row' + (rb ? ' rb' : '');
  row.innerHTML =
    '<div class="top"><label class="name" for="s_' + path + '">' + label + '</label>' +
    '<span class="val"></span></div>' +
    '<input type="range" id="s_' + path + '" min="' + min + '" max="' + max + '" step="' + step + '">';
  group.appendChild(row);

  const input = row.querySelector('input');
  const out = row.querySelector('.val');
  input.value = get(path);
  out.textContent = fmt(get(path));

  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    set(path, v);
    out.textContent = fmt(v);
    if (path === 'asymmetry.value') { PH.setAsymmetry(v); syncMeta(v); }
    if (path.startsWith('camera.')) PH.refresh();
    PH.applyLiveConfig();
  });
}

/* the overlay numbers track the asymmetry slider, so the visual and the data
   always agree — that link is the whole point of the design */
function syncMeta(a) {
  const gap = a * 12;                 // 0..1  ->  0..12% left/right gap
  const base = 28.75;
  const L = base * (1 - gap / 200);
  const R = base * (1 + gap / 200);
  document.getElementById('mL').textContent = L.toFixed(1);
  document.getElementById('mR').textContent = R.toFixed(1);
  document.getElementById('mG').textContent = gap.toFixed(1) + '%';
}
syncMeta(C.asymmetry.value);

document.getElementById('bRebuild').onclick = () => PH.rebuild();
document.getElementById('bReplay').onclick  = () => PH.replay();
document.getElementById('bBg').onclick      = () => document.getElementById('stage').classList.toggle('plain');

document.getElementById('bCopy').onclick = async (e) => {
  const lines = SPECS.filter(s => s[0] !== '__g')
    .map(s => '  ' + s[0].padEnd(28) + ': ' + fmt(get(s[0])));
  const text = '// Particle Human — tuned ' + new Date().toISOString().slice(0, 10) + '\n' + lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    e.target.textContent = '已複製 ✓';
  } catch {
    console.log(text);
    e.target.textContent = '看 console';
  }
  setTimeout(() => { e.target.textContent = '複製 CONFIG 數值'; }, 1600);
};

addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    document.getElementById('panel').classList.toggle('hidden');
    document.getElementById('hint').style.opacity =
      document.getElementById('panel').classList.contains('hidden') ? '0' : '1';
  }
  if (e.key === 'r' || e.key === 'R') PH.replay();
});
</script>
</body>
</html>
